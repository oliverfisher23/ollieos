<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OllieOS</title>
    <style>
      /* Bundled with the Mac app: shown for a moment while OllieOS opens, or when it can't be reached.
         Colours copied from artifacts/ollieos/src/theme/tokens.css (--oo-bg-gradient). */
      :root {
        color-scheme: dark;
        --bg: #2c3a55;
        --ink: #f5f2ec;
        --ink-muted: rgba(245, 242, 236, 0.72);
        --accent: #ff3c00;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background-color: var(--bg);
        background:
          radial-gradient(120% 80% at 85% 105%, #b5441a 0%, rgba(181, 68, 26, 0.55) 22%, rgba(181, 68, 26, 0) 48%),
          radial-gradient(90% 70% at 15% 0%, #39507a 0%, rgba(57, 80, 122, 0) 60%),
          radial-gradient(80% 60% at 50% 55%, #a7a39b 0%, rgba(167, 163, 155, 0) 70%),
          linear-gradient(180deg, #2c3a55 0%, #6f7277 48%, #8b6a55 100%);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        display: grid;
        place-items: center;
        padding: 16px;
        -webkit-user-select: none;
        user-select: none;
      }
      main { text-align: center; max-width: 360px; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px; background: var(--accent);
        margin: 0 auto 20px;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
      p { margin: 0; color: var(--ink-muted); }
      button {
        margin-top: 20px; padding: 10px 20px; min-height: 44px;
        border: 0; border-radius: 999px; background: var(--ink); color: #1d2433;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1 id="title">Opening OllieOS</h1>
      <p id="detail">One moment.</p>
      <button id="retry" type="button" hidden>Try again</button>
    </main>
    <script>
      const target = window.__OLLIEOS_URL__;
      const title = document.getElementById('title');
      const detail = document.getElementById('detail');
      const retry = document.getElementById('retry');
      let timer = null;

      function offline(message) {
        title.textContent = "Can't reach OllieOS";
        detail.textContent = message;
        retry.hidden = false;
        clearTimeout(timer);
        timer = setTimeout(open, 15000);
      }

      async function open() {
        clearTimeout(timer);
        if (!target) {
          offline('This copy of the app was built without an address.');
          return;
        }
        title.textContent = 'Opening OllieOS';
        detail.textContent = 'One moment.';
        retry.hidden = true;
        const abort = new AbortController();
        const giveUp = setTimeout(() => abort.abort(), 15000);
        try {
          // no-cors: we only need to know the server answers, not read the reply.
          await fetch(new URL('/api/healthz', target), { mode: 'no-cors', cache: 'no-store', signal: abort.signal });
          location.replace(target);
        } catch {
          offline(navigator.onLine ? 'The server did not answer. Trying again shortly.' : 'You are offline. OllieOS will open when you are back online.');
        } finally {
          clearTimeout(giveUp);
        }
      }

      retry.addEventListener('click', open);
      window.addEventListener('online', open);
      open();
    </script>
  </body>
</html>
