[package]
name = "ollieos-desktop"
version = "0.1.0"
description = "OllieOS for macOS: a native window onto the hosted OllieOS app"
edition = "2021"
publish = false

[lib]
name = "ollieos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
