            revokedAt: { type: [string, "null"], format: date-time }
        cursor: { type: [string, "null"], format: date-time }
        runs: { type: array, items: { $ref: "#/components/schemas/SweepRun" } }

    ConnectorKey:
      type: string
      enum: [calendar, gmail, slack, drive, granola, dropbox]

    ConnectorReadBy:
      type: string
      enum: [ollieos, claude]

    ConnectorRun:
      type: object
      required: [id, trigger, startedAt, finishedAt, ok, found, counts, error]
      properties:
        id: { type: integer }
        trigger: { type: string, enum: [timer, manual] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        ok: { type: boolean }
        found: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
        error: { type: [string, "null"] }

    ConnectorService:
      type: object
      required: [key, name, readBy, chosen, canReadDirect, account, lastGoodAt, lastFromClaudeAt, runs]
      properties:
        key: { $ref: "#/components/schemas/ConnectorKey" }
        name: { type: string }
        readBy: { $ref: "#/components/schemas/ConnectorReadBy" }
        chosen: { type: boolean, description: "True when Ollie chose who reads it" }
        canReadDirect: { type: boolean, description: "True when OllieOS can read this service itself" }
        account: { type: [string, "null"] }
        lastGoodAt: { type: [string, "null"], format: date-time }
        lastFromClaudeAt: { type: [string, "null"], format: date-time }
        runs: { type: array, items: { $ref: "#/components/schemas/ConnectorRun" } }

    ConnectorSchedule:
      type: object
      required: [enabled, everyMinutes, start, end, lastRunAt, nextRunAt]
      properties:
        enabled: { type: boolean }
        everyMinutes: { type: integer, enum: [30, 60] }
        start: { type: string, description: "HH:MM, London time" }
        end: { type: string, description: "HH:MM, London time" }
        lastRunAt: { type: [string, "null"], format: date-time }
        nextRunAt: { type: [string, "null"], format: date-time }

    Connectors:
      type: object
      required: [schedule, services, dropbox]
      properties:
        schedule: { $ref: "#/components/schemas/ConnectorSchedule" }
        services: { type: array, items: { $ref: "#/components/schemas/ConnectorService" } }
        dropbox: { $ref: "#/components/schemas/DropboxSetup" }

    DropboxSetup:
      type: object
      required: [folder, existing, listed, progress]
      properties:
        folder: { type: [string, "null"], description: "Claude's folder, or null before Ollie chooses one" }
        existing: { type: string, enum: [all, new], description: "all reads files already there once; new only reads files added or changed later" }
        listed: { type: boolean, description: False until the first check has listed the folder }
        progress:
          type: object
          required: [files, waiting, reading, failed, read, lastReadAt]
          properties:
            files: { type: integer }
            waiting: { type: integer }
            reading: { type: integer }
            failed: { type: integer }
            read: { type: integer }
            lastReadAt: { type: [string, "null"], format: date-time }

    DropboxFolderPreview:
      type: object
      required: [folder, readable, other]
      properties:
        folder: { type: string }
        readable: { type: integer, description: Markdown, text, Word and PDF files OllieOS reads }
        other: { type: integer, description: Files of other kinds, too large, or in hidden folders }

    DropboxFolderPreviewInput:
      type: object
      required: [folder]
      additionalProperties: false
      properties:
        folder: { type: string, minLength: 1, maxLength: 500 }

    RejectSourceInput:
      type: object
      required: [sourceRef]
      additionalProperties: false
      properties:
        sourceRef: { type: string, minLength: 1, maxLength: 1200 }

    DropboxFolderInput:
      type: object
      required: [folder, existing]
      additionalProperties: false
      properties:
        folder: { type: string, minLength: 1, maxLength: 500 }
        existing: { type: string, enum: [all, new] }

    ConnectorScheduleInput:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        everyMinutes: { type: integer, enum: [30, 60] }
        start: { type: string, maxLength: 5 }
        end: { type: string, maxLength: 5 }

    ConnectorReadByInput:
      type: object
      required: [readBy]
      additionalProperties: false
      properties:
        readBy: { $ref: "#/components/schemas/ConnectorReadBy" }

    ConnectorCheckResult:
      type: object
      required: [ok, found, counts, account, error, needsReconnect]
      properties:
        ok: { type: boolean }
        found: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
        account: { type: [string, "null"] }
        error: { type: [string, "null"] }
        needsReconnect: { type: boolean }

    OAuthConsent:
      type: object
      required: [clientName, redirectHost, scopes, reconnecting]
      properties:
        clientName: { type: string }
        redirectHost: { type: string }
        scopes: { type: array, items: { type: string } }
        reconnecting: { type: boolean }

    OAuthConsentDecision:
      type: object
      required: [req, decision]
      additionalProperties: false
      properties:
        req: { type: string }
        decision: { type: string, enum: [approve, deny] }

    AiAccessSummary:
      type: object
      required: [connectedTools, pendingRequests, openGrants, readsToday, hidden]
      properties:
        connectedTools: { type: integer }
        pendingRequests: { type: integer }
        openGrants: { type: integer }
        readsToday: { type: integer }
        hidden:
          type: object
          required: [projects, people, organisations]
          properties:
            projects: { type: integer }
            people: { type: integer }
            organisations: { type: integer }

    AiActivity:
      type: object
      required: [key, at, actor, kind, action, count, items, context]
      properties:
        key: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        kind: { type: string, enum: [read, search, request, write] }
        action: { type: string }
        count: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/ItemLabel" } }
        context: { type: [string, "null"], description: The Ask question, search words or requested name }

    Cadence:
      type: string
      enum: [none, weekly, fortnightly, monthly, two_monthly, quarterly]

    CadenceStatus:
      type: string
      enum: [overdue, due_soon, on_track, paused, none]

    CadenceTab:
      type: string
      enum: [all, overdue, due_soon, on_track]

    PersonCadence:
      type: object
      required: [status, daysSince, daysOverdue, daysLeft, cadence, cadenceLabel, cadencePaused, pausedByProjects]
      properties:
        status: { $ref: "#/components/schemas/CadenceStatus" }
        daysSince: { type: [integer, "null"], description: Whole days since the last contact; null when there is none on file }
        daysOverdue: { type: [integer, "null"] }
        daysLeft: { type: [integer, "null"] }
        cadence: { $ref: "#/components/schemas/Cadence" }
        cadenceLabel: { type: string }
        cadencePaused: { type: boolean }
        pausedByProjects: { type: boolean, description: True when every linked project is paused or complete }

    CadenceProject:
      type: object
      required: [id, name, slug, lifecycle]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        lifecycle: { $ref: "#/components/schemas/ProjectLifecycle" }

    CadenceRow:
      allOf:
        - $ref: "#/components/schemas/PersonCadence"
        - type: object
          required: [id, name, slug, confidential, role, organisation, project, lastContactAt]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
            confidential: { type: boolean }
            role: { type: [string, "null"] }
            organisation:
              oneOf:
                - $ref: "#/components/schemas/NamedLink"
                - type: "null"
            project:
              oneOf:
                - $ref: "#/components/schemas/CadenceProject"
                - type: "null"
            lastContactAt: { type: [string, "null"], format: date-time }

    CadenceCounts:
      type: object
      required: [all, overdue, due_soon, on_track]
      properties:
        all: { type: integer }
        overdue: { type: integer }
        due_soon: { type: integer }
        on_track: { type: integer }

    CadencePage:
      type: object
      required: [tab, counts, people]
      properties:
        tab: { $ref: "#/components/schemas/CadenceTab" }
        counts: { $ref: "#/components/schemas/CadenceCounts" }
        people: { type: array, items: { $ref: "#/components/schemas/CadenceRow" } }

    CheckInThread:
      type: object
      required: [ref, type, title, path]
      properties:
        ref: { type: string }
        type: { type: string, enum: [task, project] }
        title: { type: string }
        path: { type: string, description: App path to open the thread }

    CheckInDraft:
      type: object
      required: [text, threads]
      properties:
        text: { type: string }
        threads: { type: array, items: { $ref: "#/components/schemas/CheckInThread" } }

    NamedLink:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    Goal:
      type: object
      required: [id, parentId, name, statement, targetText, periodStart, periodEnd, confidential, sortOrder]
      properties:
        id: { type: integer }
        parentId: { type: [integer, "null"] }
        name: { type: string }
        statement: { type: [string, "null"] }
        targetText: { type: [string, "null"], description: Never sent to AI tools when the goal is confidential }
        periodStart: { type: [string, "null"], format: date }
        periodEnd: { type: [string, "null"], format: date }
        confidential: { type: boolean }
        sortOrder: { type: integer }

    GoalProject:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    SubGoal:
      allOf:
        - $ref: "#/components/schemas/Goal"
        - type: object
          required: [projects]
          properties:
            projects: { type: array, items: { $ref: "#/components/schemas/GoalProject" } }

    GoalView:
      allOf:
        - $ref: "#/components/schemas/Goal"
        - type: object
          required: [number, subGoals, projects, openTasks, dueThisWeek]
          properties:
            number: { type: integer, description: Position on the page, from 1 }
            subGoals: { type: array, items: { $ref: "#/components/schemas/SubGoal" } }
            projects: { type: array, items: { $ref: "#/components/schemas/GoalProject" }, description: Projects linked to the goal itself, not its sub-goals }
            openTasks: { type: integer, description: Including its sub-goals }
            dueThisWeek: { type: integer }

    UnlinkedTask:
      type: object
      required: [id, title, status, dueDate, project]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        dueDate: { type: [string, "null"], format: date }
        project:
          oneOf:
            - $ref: "#/components/schemas/GoalProject"
            - type: "null"

    GoalsPage:
      type: object
      required: [goals, supporting, thisWeekTotal, unlinked, weekStart]
      properties:
        goals: { type: array, items: { $ref: "#/components/schemas/GoalView" } }
        supporting: { type: integer, description: "This week's tasks that count towards a goal" }
        thisWeekTotal: { type: integer, description: "Tasks due this week or in Now" }
        unlinked: { type: array, items: { $ref: "#/components/schemas/UnlinkedTask" } }
        weekStart: { type: string, format: date }

    GoalOption:
      type: object
      required: [id, name, parentId]
      properties:
        id: { type: integer }
        name: { type: string }
        parentId: { type: [integer, "null"] }

    GoalInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        parentId: { type: [integer, "null"] }
        statement: { type: [string, "null"], maxLength: 2000 }
        targetText: { type: [string, "null"], maxLength: 2000 }
        periodStart: { type: [string, "null"], format: date }
        periodEnd: { type: [string, "null"], format: date }
        confidential: { type: boolean }
        sortOrder: { type: integer }

    GoalUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        parentId: { type: [integer, "null"] }
        statement: { type: [string, "null"], maxLength: 2000 }
        targetText: { type: [string, "null"], maxLength: 2000 }
        periodStart: { type: [string, "null"], format: date }
        periodEnd: { type: [string, "null"], format: date }
        confidential: { type: boolean }
        sortOrder: { type: integer }

    DocLocation:
      type: string
      enum: [dropbox, gdrive, claude_project, other, ollieos]

    DocumentKnowledge:
      type: object
      required: [status, lastReadAt, lastResult, error]
      properties:
        status: { type: string, enum: [idle, queued, reading, failed] }
        lastReadAt: { type: [string, "null"], format: date-time }
        lastResult: { type: [string, "null"], description: "What the last read proposed, in words" }
        error: { type: [string, "null"] }

    LibraryDocument:
      type: object
      required: [id, title, url, location, summary, confidential, lastConfirmedAt, createdBy, createdAt, projects, hiddenFromAi, contentsReadAt, textOrigin, knowledge]
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: [string, "null"], description: Null for text kept in OllieOS }
        location: { $ref: "#/components/schemas/DocLocation" }
        summary: { type: [string, "null"] }
        confidential: { type: [boolean, "null"], description: null means inherit from linked projects }
        lastConfirmedAt: { type: string, format: date-time, description: Shown as Updated }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        projects: { type: array, items: { $ref: "#/components/schemas/NamedLink" } }
        hiddenFromAi: { type: boolean }
        contentsReadAt: { type: [string, "null"], format: date-time, description: When OllieOS last read or was given the text }
        textOrigin: { type: [string, "null"], enum: [gdrive, dropbox, pasted, upload, claude, null], description: Where the kept text came from }
        knowledge:
          oneOf:
            - { $ref: "#/components/schemas/DocumentKnowledge" }
            - { type: "null" }

    DocumentInput:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2000 }
        title: { type: [string, "null"], maxLength: 300 }
        summary: { type: [string, "null"], maxLength: 2000 }
        location: { $ref: "#/components/schemas/DocLocation" }
        confidential: { type: [boolean, "null"] }
        projectIds: { type: array, items: { type: integer } }

    DocumentTextInput:
      type: object
      required: [title, text]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        text: { type: string, minLength: 1, maxLength: 400000 }
        summary: { type: [string, "null"], maxLength: 2000 }
        confidential: { type: [boolean, "null"] }
        projectIds: { type: array, items: { type: integer } }
        buildKnowledge: { type: boolean }

    DocumentUploadInput:
      type: object
      required: [fileName, dataBase64]
      additionalProperties: false
      properties:
        fileName: { type: string, minLength: 1, maxLength: 300 }
        dataBase64: { type: string, minLength: 1 }
        title: { type: [string, "null"], maxLength: 300 }
        summary: { type: [string, "null"], maxLength: 2000 }
        confidential: { type: [boolean, "null"] }
        projectIds: { type: array, items: { type: integer } }
        buildKnowledge: { type: boolean }

    DriveImportInput:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1, maxLength: 2000 }

    DriveImport:
      type: object
      required: [folder, added, alreadyThere, skipped, queued, documents]
      properties:
        folder: { type: [string, "null"], description: "The folder's name, when the link was a folder" }
        added: { type: integer }
        alreadyThere: { type: integer }
        skipped: { type: integer, description: Files OllieOS cannot read }
        queued: { type: integer }
        documents: { type: array, items: { $ref: "#/components/schemas/LibraryDocument" } }

    SessionLink:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    SessionListItem:
      type: object
      required: [id, title, summary, outcomes, happenedAt, archived, confidential, hiddenFromAi, projects, people, taskCount, decisionCount, documentCount, waitingCount]
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: string }
        outcomes: { type: array, items: { type: string }, description: What was done }
        happenedAt: { type: string, format: date-time }
        archived: { type: boolean, description: Older than 90 days with nothing from it still open; left out of briefs }
        confidential: { type: [boolean, "null"], description: null means it follows the projects and people it touched }
        hiddenFromAi: { type: boolean }
        projects: { type: array, items: { $ref: "#/components/schemas/SessionLink" } }
        people: { type: array, items: { $ref: "#/components/schemas/SessionLink" } }
        taskCount: { type: integer }
        decisionCount: { type: integer, description: Decisions from it Ollie approved }
        documentCount: { type: integer, description: Documents from it Ollie added to the Library }
        waitingCount: { type: integer, description: Suggestions from it still in the Knowledge Inbox }

    SessionTask:
      type: object
      required: [id, title, kind, status]
      properties:
        id: { type: integer }
        title: { type: string }
        kind: { type: string }
        status: { type: string }

    SessionDecision:
      type: object
      required: [id, text]
      properties:
        id: { type: integer }
        text: { type: string }

    SessionDocument:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }

    SessionKnowledge:
      type: object
      required: [state, lastReadAt, found, error]
      properties:
        state: { type: string, enum: [none, waiting, reading, read, failed] }
        lastReadAt: { type: [string, "null"], format: date-time }
        found: { type: [string, "null"], description: What the last read proposed, in words }
        error: { type: [string, "null"] }

    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionListItem"
        - type: object
          required: [transcript, createdBy, tasks, decisions, documents, knowledge]
          properties:
            transcript: { type: [string, "null"] }
            createdBy: { type: string }
            tasks: { type: array, items: { $ref: "#/components/schemas/SessionTask" } }
            decisions: { type: array, items: { $ref: "#/components/schemas/SessionDecision" } }
            documents: { type: array, items: { $ref: "#/components/schemas/SessionDocument" } }
            knowledge: { $ref: "#/components/schemas/SessionKnowledge" }

    SessionUpdate:
      type: object
      properties:
        confidential: { type: [boolean, "null"] }

    DocumentUpdate:
      type: object
      properties:
        url: { type: string, minLength: 1, maxLength: 2000 }
        title: { type: string, minLength: 1, maxLength: 300 }
        summary: { type: [string, "null"], maxLength: 2000 }
        location: { $ref: "#/components/schemas/DocLocation" }
        confidential: { type: [boolean, "null"] }
        projectIds: { type: array, items: { type: integer } }
        confirm: { type: boolean, description: Still current; moves Updated to now }

    Playbook:
      type: object
      required: [id, title, appliesWhen, rule, enabled, createdBy, createdAt, updatedAt, projects, organisations, sentToAi]
      properties:
        id: { type: integer }
        title: { type: string }
        appliesWhen: { type: string }
        rule: { type: string }
        enabled: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        projects: { type: array, items: { $ref: "#/components/schemas/NamedLink" } }
        organisations: { type: array, items: { $ref: "#/components/schemas/NamedLink" } }
        sentToAi: { type: boolean, description: Enabled and global or linked to something AI can read }

    PlaybookInput:
      type: object
      required: [title, appliesWhen, rule]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        appliesWhen: { type: string, minLength: 1, maxLength: 300 }
        rule: { type: string, minLength: 1, maxLength: 400 }
        enabled: { type: boolean }
        projectIds: { type: array, items: { type: integer } }
        organisationIds: { type: array, items: { type: integer } }

    PlaybookUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        appliesWhen: { type: string, minLength: 1, maxLength: 300 }
        rule: { type: string, minLength: 1, maxLength: 400 }
        enabled: { type: boolean }
        projectIds: { type: array, items: { type: integer } }
        organisationIds: { type: array, items: { type: integer } }
