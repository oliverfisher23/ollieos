        state: { type: string, enum: [pending, accepted, done, dropped, answered], description: answered means someone wrote back before Ollie decided }
        text: { type: string, description: "The action, or for an unanswered email the ask: who owes what" }
        action: { type: [string, "null"], description: "The next step (or chase line), in one sentence" }
        quote: { type: [string, "null"], description: The line in the notes or email it came from }
