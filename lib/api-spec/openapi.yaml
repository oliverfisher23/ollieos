openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: OllieOS app API. Every route except health and auth requires the signed-in, allowlisted user.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: home
    description: Home screen summary
  - name: tasks
    description: Tasks, quick add and task detail
  - name: knowledge
    description: Projects, people, organisations, decisions, notes, facts, links and search
  - name: ask
    description: Ask OllieOS
  - name: noise
    description: Noise rules
  - name: access
    description: AI access requests, connected tools and the AI read log
  - name: direction
    description: Goals, relationship cadence, the document Library and rules
  - name: preparation
    description: Meeting briefs and the daily digest
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success, or to /not-authorised when the email is not allowlisted.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /home:
    get:
      operationId: getHome
      tags: [home]
      summary: Everything the Home screen needs in one call
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for a tab with optional filters
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskTab"
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskSource"
        - name: weekStart
          in: query
          required: false
          description: Monday of the week (YYYY-MM-DD, London). Open tabs filter by due date, Done by completion date.
          schema:
            type: string
            format: date
        - name: includeUndated
          in: query
          required: false
          description: With weekStart on open tabs, also include tasks with no due date.
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Tab counts and the four stat cards
      parameters:
        - name: weekStart
          in: query
          required: false
          description: Monday of the week for "Due this week" and "Done this week". Defaults to the current London week.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/quick-add:
    post:
      operationId: quickAddTask
      tags: [tasks]
      summary: Create a task from raw quick-add text (!high !low due:fri #backlog @project-slug)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickAddInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickAddResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/reorder:
    post:
      operationId: reorderTasks
      tags: [tasks]
      summary: Put tasks in the order Ollie dragged them, or clear that order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReorderInput"
      responses:
        "204":
          description: Saved
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Task with source card and history
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update any editable field. Status changes set completedAt, triagedAt and waitingSince.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/snooze:
    post:
      operationId: snoozeTask
      tags: [tasks]
      summary: Snooze until tomorrow 06:00 London time
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Snoozed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/draft-prompt:
    get:
      operationId: getTaskDraftPrompt
      tags: [tasks]
      summary: A prepared prompt for Claude to draft a reply, copied to the clipboard
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Prompt text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipboardText"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/weekly-update:
    get:
      operationId: getWeeklyUpdate
      tags: [tasks]
      summary: Done items for a week grouped by project, as plain text for the clipboard
      parameters:
        - name: weekStart
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly update text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyUpdate"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}/triage:
    post:
      operationId: triageTask
      tags: [tasks]
      summary: Triage one item to Now, Backlog, Waiting, Noise or Dropped, optionally making a noise rule
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageInput"
      responses:
        "200":
          description: Triaged task, and the noise rule if one was made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/undo:
    post:
      operationId: undoTask
      tags: [tasks]
      summary: Undo the last status change, triage, snooze or restore on this task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Nothing to undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/restore:
    post:
      operationId: restoreTask
      tags: [tasks]
      summary: Restore a Noise or Dropped item to the Inbox, or an Archived one to the Backlog
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Restored task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Not in Noise or Dropped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/continue-repeat:
    post:
      operationId: continueRepeat
      tags: [tasks]
      summary: After dropping or archiving a repeating task, make the next one anyway
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: It does not repeat, or the next one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /plan:
    get:
      operationId: getDayPlan
      tags: [plan]
      summary: Today's plan, with meetings, and suggestions while there is no plan yet
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayPlan"
        "403":
          $ref: "#/components/responses/NotAuthorised"
    put:
      operationId: saveDayPlan
      tags: [plan]
      summary: Save today's tasks and fit them around the meetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayPlan"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /plan/fit:
    post:
      operationId: refitDayPlan
      tags: [plan]
      summary: Fit today's unfinished tasks again from now
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayPlan"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /settings/working-hours:
    get:
      operationId: getWorkingHours
      tags: [plan]
      summary: Working hours used by Plan my day
      responses:
        "200":
          description: Hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkingHours"
        "403":
          $ref: "#/components/responses/NotAuthorised"
    put:
      operationId: updateWorkingHours
      tags: [plan]
      summary: Change working hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkingHours"
      responses:
        "200":
          description: Hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkingHours"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /backlog/clear-out:
    get:
      operationId: getClearOut
      tags: [plan]
      summary: Backlog tasks untouched for 30 days, and whether to offer the clear-out this week
      responses:
        "200":
          description: Clear-out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearOut"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /backlog/clear-out/dismiss:
    post:
      operationId: dismissClearOut
      tags: [plan]
      summary: Hide the clear-out card until the next clear-out Monday
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearOutStatus"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /backlog/clear-out/{id}/keep:
    post:
      operationId: keepInBacklog
      tags: [plan]
      summary: Still wanted, so the 30-day clock starts again
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Not in the Backlog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}/keep:
    post:
      operationId: keepTask
      tags: [tasks]
      summary: Keep an Inbox item the noise check flagged; clears "Probably noise"
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/reply-draft:
    get:
      operationId: getReplyDraft
      tags: [tasks]
      summary: The saved reply draft for an email task, if there is one
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The draft, or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraftResult"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: writeReplyDraft
      tags: [tasks]
      summary: Writes (or rewrites) a reply with AI from the email thread, OllieOS and rules. Nothing is sent.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyDraftWriteInput"
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Not an email, or hidden from AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The AI or Gmail could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/reply-draft/gmail:
    post:
      operationId: saveReplyDraftToGmail
      tags: [tasks]
      summary: Saves the edited reply as a draft in the Gmail thread (updating the earlier one). Never sends.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyDraftInput"
      responses:
        "200":
          description: The draft, with the Gmail link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: No Gmail thread to save into
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Gmail could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/reply-draft/dismiss:
    post:
      operationId: dismissEmailDraft
      tags: [email]
      summary: Takes the draft off the Email page's Drafts list. The draft stays on its task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: No draft for that task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/reply-draft/brief:
    post:
      operationId: briefReplyDraft
      tags: [email]
      summary: "Brief a reply: keeps a one-line brief, puts the email on Drafts as Writing, and writes the draft in the background. Once written it is saved to Gmail as a draft. Never sent."
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyBriefInput"
      responses:
        "202":
          description: The draft, being written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Not an email task, hidden from AI, or already being written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/thread/summary:
    get:
      operationId: getTaskThreadSummary
      tags: [email]
      summary: A few lines on a long email thread (4 or more messages), kept until a new message arrives
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The summary, or why there is none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummary"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Not an email task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Gmail or the summary could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/thread/attachments:
    post:
      operationId: saveEmailAttachment
      tags: [email]
      summary: Saves a PDF, Word or text attachment under 10 MB to the Library and queues it to be read for knowledge
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAttachmentInput"
      responses:
        "201":
          description: The Library document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDocument"
        "400":
          description: Not a readable file, or too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: The attachment is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already in the Library, or not an email task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Gmail could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /email/style:
