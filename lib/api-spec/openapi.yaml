openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: OllieOS app API. Every route except health and auth requires the signed-in, allowlisted user.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: home
    description: Home screen summary
  - name: tasks
    description: Tasks, quick add and task detail
  - name: knowledge
    description: Projects, people, organisations, decisions, notes, facts, links and search
  - name: ask
    description: Ask OllieOS
  - name: noise
    description: Noise rules
  - name: access
    description: AI access requests, connected tools and the AI read log
  - name: direction
    description: Goals, relationship cadence, the document Library and playbooks
  - name: preparation
    description: Meeting briefs and the daily digest
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success, or to /not-authorised when the email is not allowlisted.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /home:
    get:
      operationId: getHome
      tags: [home]
      summary: Everything the Home screen needs in one call
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for a tab with optional filters
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskTab"
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskSource"
        - name: weekStart
          in: query
          required: false
          description: Monday of the week (YYYY-MM-DD, London). Open tabs filter by due date, Done by completion date.
          schema:
            type: string
            format: date
        - name: includeUndated
          in: query
          required: false
          description: With weekStart on open tabs, also include tasks with no due date.
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Tab counts and the four stat cards
      parameters:
        - name: weekStart
          in: query
          required: false
          description: Monday of the week for "Due this week" and "Done this week". Defaults to the current London week.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/quick-add:
    post:
      operationId: quickAddTask
      tags: [tasks]
      summary: Create a task from raw quick-add text (!high !low due:fri #backlog @project-slug)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickAddInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickAddResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Task with source card and history
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update any editable field. Status changes set completedAt, triagedAt and waitingSince.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/snooze:
    post:
      operationId: snoozeTask
      tags: [tasks]
      summary: Snooze until tomorrow 06:00 London time
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Snoozed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/draft-prompt:
    get:
      operationId: getTaskDraftPrompt
      tags: [tasks]
      summary: A prepared prompt for Claude to draft a reply, copied to the clipboard
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Prompt text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipboardText"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/weekly-update:
    get:
      operationId: getWeeklyUpdate
      tags: [tasks]
      summary: Done items for a week grouped by project, as plain text for the clipboard
      parameters:
        - name: weekStart
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly update text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyUpdate"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}/triage:
    post:
      operationId: triageTask
      tags: [tasks]
      summary: Triage one item to Now, Backlog, Waiting, Noise or Dropped, optionally making a noise rule
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageInput"
      responses:
        "200":
          description: Triaged task, and the noise rule if one was made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/undo:
    post:
      operationId: undoTask
      tags: [tasks]
      summary: Undo the last status change, triage, snooze or restore on this task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Nothing to undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/restore:
    post:
      operationId: restoreTask
      tags: [tasks]
      summary: Restore a Noise or Dropped item to the Inbox
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Restored task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Not in Noise or Dropped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/keep:
    post:
      operationId: keepTask
      tags: [tasks]
      summary: Keep an Inbox item the noise check flagged; clears "Probably noise"
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/reply-draft:
    get:
      operationId: getReplyDraft
      tags: [tasks]
      summary: The saved reply draft for an email task, if there is one
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The draft, or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraftResult"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: writeReplyDraft
      tags: [tasks]
      summary: Writes (or rewrites) a reply with AI from the email thread, OllieOS and playbooks. Nothing is sent.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyDraftWriteInput"
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Not an email, or hidden from AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The AI or Gmail could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/reply-draft/gmail:
    post:
      operationId: saveReplyDraftToGmail
      tags: [tasks]
      summary: Saves the edited reply as a draft in the Gmail thread (updating the earlier one). Never sends.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyDraftInput"
      responses:
        "200":
          description: The draft, with the Gmail link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: No Gmail thread to save into
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Gmail could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/reply-draft/dismiss:
    post:
      operationId: dismissEmailDraft
      tags: [email]
      summary: Takes the draft off the Email page's Drafts list. The draft stays on its task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: No draft for that task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/thread:
    get:
      operationId: getTaskThread
      tags: [email]
      summary: The email thread behind an email task, oldest first, for reading on the Email page. Read only.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailThread"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Not an email task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Gmail could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /email/drafts:
    get:
      operationId: listEmailDrafts
      tags: [email]
      summary: Reply and chase drafts still to go, newest first
      responses:
        "200":
          description: The drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDraftList"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}/chase-line:
    get:
      operationId: getTaskChaseLine
      tags: [tasks]
      summary: A short chase message for the person this task is waiting on
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Chase text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipboardText"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/noise-rule-options:
    get:
      operationId: getNoiseRuleOptions
      tags: [tasks]
      summary: Rules that could be made from this item ("Always ignore items like this"). Empty for meeting items.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoiseRuleOption"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /noise-rules:
    get:
      operationId: listNoiseRules
      tags: [noise]
      summary: All noise rules with hit counts
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoiseRule"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /noise-rules/{id}:
    patch:
      operationId: updateNoiseRule
      tags: [noise]
      summary: Turn a rule on or off
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoiseRuleUpdate"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoiseRule"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /projects:
    get:
      operationId: listProjects
      tags: [knowledge]
      summary: Projects with open task counts, for the Knowledge sidebar and pickers
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProjectListItem" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: createProject
      tags: [knowledge]
      summary: New project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /projects/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getProject
      tags: [knowledge]
      summary: Project page
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [knowledge]
      summary: Edit a project, including its AI access switches
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /people:
    get:
      operationId: listPeople
      tags: [knowledge]
      summary: People with what is open between Ollie and each of them
      responses:
        "200":
          description: People
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PersonListItem" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: createPerson
      tags: [knowledge]
      summary: New person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "409": { $ref: "#/components/responses/Error" }

  /people/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPerson
      tags: [knowledge]
      summary: Person page
      responses:
        "200":
          description: Person detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePerson
      tags: [knowledge]
      summary: Edit a person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /people/cadence:
    get:
      operationId: listCadence
      tags: [direction]
      summary: Everyone with a check-in cadence, with their status and the count for each tab
      parameters:
        - name: tab
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CadenceTab" }
      responses:
        "200":
          description: Cadence list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CadencePage" }
        "400": { $ref: "#/components/responses/Error" }
