        moved:
          oneOf: [{ $ref: "#/components/schemas/DigestSection" }, { type: "null" }]
        quiet:
          oneOf: [{ $ref: "#/components/schemas/DigestSection" }, { type: "null" }]
        today: { type: array, items: { $ref: "#/components/schemas/DigestEvent" } }
