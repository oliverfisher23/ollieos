      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listTaskEvidence
      tags: [tasks]
      summary: "What OllieOS has seen: later messages, emails and meeting notes that show this task is done or moving (Part U), newest first"
      responses:
        "200":
          description: Evidence
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TaskEvidence" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /tasks/{id}/evidence/{evidenceId}/dismiss:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - name: evidenceId
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: dismissTaskEvidence
      tags: [tasks]
      summary: "\"Not done\" on a Looks done marker: that evidence no longer marks the task"
      responses:
        "200":
          description: The task's evidence after the change
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TaskEvidence" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /email/slack:
    get:
      operationId: listSlackToAnswer
      tags: [email]
      summary: "Slack to answer: conversations from the last 14 days whose newest message is from someone else, newest first. Nothing is posted to Slack."
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlackToAnswer" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /email/slack/{id}/done:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: markSlackToAnswerDone
      tags: [email]
      summary: Takes a Slack conversation off To answer until a newer message arrives, and marks its open task done
      responses:
        "200":
          description: What was changed, for Undo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailInboxDone" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /email/slack/{id}/undo-done:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: undoSlackToAnswerDone
      tags: [email]
      summary: Puts a Slack conversation back on To answer and its task back where it was
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailInboxDone" }
      responses:
        "204":
          description: Back on To answer
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /email/slack/{id}/task:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: ensureSlackToAnswerTask
      tags: [email]
      summary: "Make a task: \"Reply to <name> on Slack\", status Now, linked to the message. An open task already linked is used instead."
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailInboxTask" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /email/slack/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: draftSlackToAnswerReply
      tags: [email]
      summary: Drafts a short Slack reply in Ollie's style for him to copy. Nothing is posted.
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlackReplyDraft" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

