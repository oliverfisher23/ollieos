        hitCount:
          type: integer
        lastHitAt:
          type: [string, "null"]
          format: date-time
        createdFromTaskId:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time

    NoiseRuleUpdate:
      type: object
