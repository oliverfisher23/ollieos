        sourceUrl: { type: [string, "null"] }
        email: { type: [string, "null"], description: "Unanswered email: the address of the person who should answer" }
        reason: { type: [string, "null"], description: "Unanswered email: why Ollie expected an answer" }
        suggestedType: { type: string, enum: [task, promise, waiting] }
        owner: { type: string, description: "Who owns it: You, or the other person's name" }
