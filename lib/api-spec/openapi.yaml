        cc: { type: string, description: Comma-separated addresses }
        subject: { type: string }
        body: { type: string }
        canSaveToGmail:
          type: boolean
          description: False when the email did not come from Gmail directly, so there is no thread to save into
        savedAt:
          type: [string, "null"]
          format: date-time
          description: When it was last saved to Gmail
        gmailUrl:
          type: [string, "null"]
          description: Opens the thread in Gmail, with the draft in it
        sentAt:
          type: [string, "null"]
          format: date-time
          description: When a Gmail check saw an email sent in the thread after this draft
        updatedAt:
          type: string
          format: date-time

    ReplyDraftResult:
