        messages:
          type: array
          items:
            $ref: "#/components/schemas/EmailThreadMessage"
    EmailThreadMessage:
      type: object
      required: [id, fromName, fromEmail, to, cc, at, text, fromOllie]
      properties:
        id: { type: string }
        fromName: { type: [string, "null"] }
        fromEmail: { type: [string, "null"] }
        to: { type: string }
        cc: { type: string }
        at: { type: string, format: date-time }
        text: { type: string }
        fromOllie: { type: boolean }
    EmailDraftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
