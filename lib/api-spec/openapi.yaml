    DigestSection:
      type: object
      required: [items, more, moreHref]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DigestItem" } }
        more: { type: integer, description: Items beyond the 5 shown }
        moreHref: { type: [string, "null"] }

    DigestEvent:
      type: object
      required: [eventId, title, startsAt, hasBrief]
      properties:
        eventId: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        hasBrief: { type: boolean }

    DigestSections:
      type: object
      required: [needs, moved, quiet, today, quietNight]
      properties:
        needs:
          oneOf: [{ $ref: "#/components/schemas/DigestSection" }, { type: "null" }]
        moved:
          oneOf: [{ $ref: "#/components/schemas/DigestSection" }, { type: "null" }]
        quiet:
          oneOf: [{ $ref: "#/components/schemas/DigestSection" }, { type: "null" }]
        changed:
          description: "Part Q: Library documents someone else changed since the last digest. Missing on older digests."
          oneOf: [{ $ref: "#/components/schemas/DigestSection" }, { type: "null" }]
        today: { type: array, items: { $ref: "#/components/schemas/DigestEvent" } }
        quietNight: { type: boolean }

    Digest:
      type: object
      required: [id, date, windowStart, summary, sections, createdAt]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        windowStart: { type: string, format: date-time }
        summary: { type: [string, "null"], description: One sentence. Null when the model could not write it. }
        sections: { $ref: "#/components/schemas/DigestSections" }
        createdAt: { type: string, format: date-time }

    DigestListItem:
      type: object
      required: [date, summary]
      properties:
        date: { type: string, format: date }
        summary: { type: [string, "null"] }

    NoiseMatchType:
      type: string
      enum: [from_address_equals, from_domain_equals, slack_channel_equals, title_contains]

    NoiseRuleSummary:
