          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roundup" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /roundups/{id}/draft:
    post:
      operationId: saveRoundupDraft
      tags: [knowledge]
      summary: Save the round-up as a Gmail draft with no recipient, leaving out confidential and hidden items. Never sends.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /settings/roundup:
    get:
      operationId: getRoundupSchedule
      tags: [knowledge]
      summary: When the weekly round-up is made
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundupSchedule" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    put:
      operationId: setRoundupSchedule
      tags: [knowledge]
      summary: Change when the weekly round-up is made
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundupSchedule" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundupSchedule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token, `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Invalid input, not found, conflict or upstream failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotAuthorised:
      description: Signed out, or signed in with an email that is not allowlisted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ContextPack:
      type: object
      required: [fileName, content, madeAt, included, leftOut]
      properties:
        fileName: { type: string }
        content: { type: string, description: Markdown }
        madeAt: { type: string, format: date-time }
        included: { type: integer }
        leftOut: { type: integer, description: Confidential or hidden items left out of the file }

    RoundupSchedule:
      type: object
      required: [day, hour]
      properties:
        day: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday }
        hour: { type: integer, minimum: 0, maximum: 23 }

    RoundupLine:
      type: object
      required: [text, detail, private]
      properties:
        text: { type: string }
        detail: { type: [string, "null"] }
        private: { type: boolean, description: Confidential or hidden from AI; left out of the Gmail draft }

    RoundupContent:
      type: object
      required: [approved, contradictions, stale, rules, playbooks, products]
      properties:
        approved: { type: array, items: { $ref: "#/components/schemas/RoundupLine" } }
        contradictions: { type: array, items: { $ref: "#/components/schemas/RoundupLine" } }
        stale: { type: array, items: { $ref: "#/components/schemas/RoundupLine" } }
        rules: { type: array, items: { $ref: "#/components/schemas/RoundupLine" } }
        playbooks: { type: array, items: { $ref: "#/components/schemas/RoundupLine" } }
        products: { type: array, items: { $ref: "#/components/schemas/RoundupLine" } }
        documents:
          type: array
          description: "Part Q: Library documents someone else changed this week. Missing on older round-ups."
          items: { $ref: "#/components/schemas/RoundupLine" }
        agents:
          type: array
          description: "Part W: agents whose scorecard dropped on last week. Missing on older round-ups."
          items: { $ref: "#/components/schemas/RoundupLine" }
        time:
          type: array
          description: "Part R: where meeting time went this week. Missing on older round-ups."
          items: { $ref: "#/components/schemas/RoundupLine" }

    Roundup:
      type: object
      required: [id, weekStart, weekEnd, manual, createdAt, draftSaved, content]
      properties:
        id: { type: integer }
        weekStart: { type: string, format: date-time }
        weekEnd: { type: string, format: date-time }
        manual: { type: boolean }
        createdAt: { type: string, format: date-time }
        draftSaved: { type: boolean }
        content: { $ref: "#/components/schemas/RoundupContent" }

    RoundupWeek:
      type: object
      required: [id, weekEnd, manual]
      properties:
        id: { type: integer }
        weekEnd: { type: string, format: date-time }
        manual: { type: boolean }

    RoundupPage:
      type: object
      required: [roundup, weeks, schedule]
      properties:
        roundup:
          oneOf:
            - $ref: "#/components/schemas/Roundup"
            - type: "null"
        weeks: { type: array, items: { $ref: "#/components/schemas/RoundupWeek" } }
        schedule: { $ref: "#/components/schemas/RoundupSchedule" }

    KnowledgeInboxContradicted:
      type: object
      required: [ref, type, label, text, why, target, saidBy, saidAt, source, stronger, weighing]
      properties:
        ref: { type: string }
        type: { type: string, enum: [fact, decision, rule] }
        label: { type: string }
        text: { type: string }
        why: { type: string, description: How they disagree }
        target:
          oneOf:
            - $ref: "#/components/schemas/KnowledgeInboxTarget"
            - type: "null"
        saidBy:
          oneOf:
            - $ref: "#/components/schemas/KnowledgeInboxSaidBy"
            - type: "null"
        saidAt: { type: [string, "null"], format: date-time }
        source: { type: [string, "null"] }
        stronger: { type: string, enum: [new, old, even] }
        weighing: { type: string, description: One line on which side looks stronger }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TaskStatus:
      type: string
      enum: [inbox, now, backlog, waiting, done, noise, dropped, archived]
    TaskKind:
      type: string
      enum: [task, promise]
    Priority:
      type: string
      enum: [high, medium, low]
    TaskSource:
      type: string
      enum: [email, slack, meeting, quarterly, manual, session, voice]
    TaskTab:
      type: string
      enum: [inbox, open, now, backlog, waiting, done, noise, dropped, archived]

    EntitySummary:
      type: object
      required: [id, name, slug, confidential]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        confidential:
          type: boolean

    Task:
      type: object
      required:
        - id
        - title
        - kind
        - status
        - priority
        - dueDate
        - snoozedUntil
        - source
        - sourceRef
        - sourceUrl
        - sourceQuote
        - sourceSubject
        - fromName
        - fromAddress
        - snippet
        - suggestedAction
        - notes
        - project
        - person
        - waitingOn
        - waitingSince
        - confidential
        - capturedAt
        - createdBy
        - createdAt
        - updatedAt
        - completedAt
        - triagedAt
        - stale
        - noiseRule
        - hiddenFromAi
        - goal
        - goalId
        - notGoalWork
        - noiseHint
        - repeat
        - steps
        - position
      properties:
        position:
          type: [integer, "null"]
          description: Where Ollie dragged it in the list; lower comes first. Null when never placed by hand.
        repeat:
          description: How it repeats, anchored on its due date. Null when it does not.
          oneOf:
            - $ref: "#/components/schemas/RepeatRule"
            - type: "null"
        steps:
          type: array
          description: Checklist steps, in order
          items: { $ref: "#/components/schemas/TaskStep" }
        id:
          type: integer
        title:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: [string, "null"]
          format: date
        snoozedUntil:
          type: [string, "null"]
          format: date-time
        source:
          $ref: "#/components/schemas/TaskSource"
        sourceRef:
          type: [string, "null"]
        sourceUrl:
          type: [string, "null"]
        sourceQuote:
          type: [string, "null"]
        sourceSubject:
          type: [string, "null"]
        fromName:
          type: [string, "null"]
        fromAddress:
          type: [string, "null"]
        snippet:
          type: [string, "null"]
        suggestedAction:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        project:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        person:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        waitingOn:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        waitingSince:
          type: [string, "null"]
          format: date-time
        confidential:
          type: [boolean, "null"]
          description: null means inherit from linked items
        capturedAt:
          type: [string, "null"]
          format: date-time
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        triagedAt:
          type: [string, "null"]
          format: date-time
        stale:
          type: boolean
          description: Backlog item untouched for 30 days or more
        noiseRule:
          description: The rule that caught this item, if any
          oneOf:
            - $ref: "#/components/schemas/NoiseRuleSummary"
            - type: "null"
        hiddenFromAi:
          type: boolean
          description: AI tools cannot read this task without an approval (own flag or inherited)
        goal:
          description: The goal it counts towards, its own link or else its project's (inherited)
          oneOf:
            - $ref: "#/components/schemas/TaskGoal"
            - type: "null"
        goalId:
          type: [integer, "null"]
          description: A direct goal link; overrides the project's goal
        notGoalWork:
          type: boolean
          description: Ollie marked it as not goal work
        noiseHint:
          type: [string, "null"]
          description: Why this Inbox item is probably noise. Null when it looks real, once kept, or outside the Inbox.
        looksDone:
          type: [string, "null"]
          description: "Part U: one line of evidence from elsewhere that this open task is done (who said it, where, and the sentence), or null"
        stuck:
          description: "Section 26: why this Now or Backlog task looks stuck and the coach's way out. Null unless it shows (not taken, not put off in the last 30 days)."
          oneOf:
            - $ref: "#/components/schemas/StuckHint"
            - type: "null"
        delegateHint:
          description: "Section 23: a colleague who could take this Now or Backlog task, why, and a draft Slack message. Null once dismissed or outside Now and Backlog."
          oneOf:
            - $ref: "#/components/schemas/DelegateHint"
            - type: "null"

    StuckHint:
      type: object
      required: [signals, wayOut, why, steps, repeatEvery, nextStep]
      properties:
        signals: { type: string, description: "How it slipped, from its history" }
        wayOut:
          description: Null for a task hidden from AI, which gets no suggestion
          oneOf:
            - { type: string, enum: [break_down, delegate, drop, repeat, next_step] }
            - type: "null"
        why: { type: [string, "null"] }
        steps: { type: array, items: { type: string } }
        repeatEvery:
          oneOf:
            - { type: string, enum: [week, fortnight, month, quarter] }
            - type: "null"
        nextStep: { type: [string, "null"] }
        appliedAt: { type: [string, "null"] }

    DelegateHint:
      type: object
      required: [personId, personName, why, message]
      properties:
        personId: { type: integer }
        personName: { type: string }
        why: { type: string }
        message: { type: string }

    RepeatEvery:
      type: string
      enum: [day, weekday, week, fortnight, month, quarter, year]

    RepeatRule:
      type: object
      required: [every]
      properties:
        every: { $ref: "#/components/schemas/RepeatEvery" }
        day: { type: integer, description: "Day of the month, for month, quarter and year by date" }
        month: { type: integer, description: Month of the year, for year }
        weekday: { type: integer, description: "Day of the week (0 is Sunday), for week, fortnight and month by weekday" }
        nth: { type: integer, description: "Which one in the month, 1 to 4, or 5 for the last" }

    RepeatInput:
      type: object
      required: [every]
      properties:
        every: { $ref: "#/components/schemas/RepeatEvery" }
        byWeekday: { type: boolean, description: "For monthly, repeat on e.g. the second Tuesday instead of the date" }

    TaskStep:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string }
        title: { type: string }
        done: { type: boolean }

    WorkingHours:
      type: object
      required: [start, end]
      properties:
        start: { type: string, description: "HH:MM, London time" }
        end: { type: string, description: "HH:MM, London time" }

    PlanItemInput:
      type: object
      required: [taskId, minutes]
      properties:
        taskId: { type: integer }
        minutes: { type: integer, description: "15, 30, 60 or 120" }

    PlanInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: In the order Ollie wants to do them
          items: { $ref: "#/components/schemas/PlanItemInput" }

    PlannedTask:
      type: object
      required: [task, minutes, start, end, clash]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        minutes: { type: integer }
        start: { type: [string, "null"], description: "HH:MM. Null when it did not fit today." }
        end: { type: [string, "null"] }
        clash: { type: boolean, description: "A meeting now overlaps it, so it needs fitting again" }

    PlanMeeting:
      type: object
      required: [id, title, personal, startsAt, endsAt]
      properties:
        id: { type: integer }
        title: { type: string }
        personal: { type: boolean }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    PlanSuggestion:
      type: object
      required: [task, reason, carriedOver]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        reason: { type: string }
        carriedOver: { type: boolean, description: In an earlier plan and not finished }

    DayPlan:
      type: object
      required: [date, workingHours, made, items, meetings, suggestions]
      properties:
        date: { type: string, format: date }
        workingHours: { $ref: "#/components/schemas/WorkingHours" }
        made: { type: boolean, description: True once Ollie has made today's plan }
        items: { type: array, items: { $ref: "#/components/schemas/PlannedTask" } }
        meetings: { type: array, items: { $ref: "#/components/schemas/PlanMeeting" } }
        suggestions:
          type: array
          description: Only while there is no plan yet. Unfinished tasks from the last plan first.
          items: { $ref: "#/components/schemas/PlanSuggestion" }

    ClearOutStatus:
      type: object
      required: [count, show]
      properties:
        count: { type: integer, description: Backlog tasks untouched for 30 days or more }
        show: { type: boolean, description: Offer the clear-out on Home this week }

    ClearOut:
      type: object
      required: [count, show, tasks]
      properties:
        count: { type: integer }
        show: { type: boolean }
        tasks:
          type: array
          description: Oldest first, up to 200
          items: { $ref: "#/components/schemas/Task" }

    TaskGoal:
      type: object
      required: [id, name, inherited]
      properties:
        id: { type: integer }
        name: { type: string }
        inherited: { type: boolean, description: True when it comes from the task's project }

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: [string, "null"]
          format: date
        notes:
          type: [string, "null"]
        projectId:
          type: [integer, "null"]
        personId:
          type: [integer, "null"]
        waitingOnPersonId:
          type: [integer, "null"]
        confidential:
          type: [boolean, "null"]
        goalId:
          type: [integer, "null"]
        notGoalWork:
          type: boolean
        repeat:
          description: Null stops repeating
          oneOf:
            - $ref: "#/components/schemas/RepeatInput"
            - type: "null"
        steps:
          type: array
          description: The whole checklist, in order
          items: { $ref: "#/components/schemas/TaskStep" }

    HistoryEvent:
      type: object
      required: [id, actor, action, summary, createdAt]
      properties:
        id:
          type: integer
        actor:
          type: string
          description: ollie, claude, ingest, or the AI client name
        action:
          type: string
        summary:
          type: string
          description: Plain British English description, e.g. "Status changed from Inbox to Now"
        createdAt:
          type: string
          format: date-time

    TaskDetail:
      type: object
      required: [task, history]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        history:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/HistoryEvent"

    TaskSummary:
      type: object
      required: [tabs, stats]
      properties:
        tabs:
          type: object
          required: [inbox, open, now, backlog, waiting, done, noise, dropped, archived]
          properties:
            archived: { type: integer }
            inbox: { type: integer }
            open: { type: integer, description: "inbox + now + backlog + waiting" }
            now: { type: integer }
            backlog: { type: integer }
            waiting: { type: integer }
            done: { type: integer }
            noise: { type: integer }
            dropped: { type: integer }
        stats:
          type: object
          required: [inboxToTriage, dueThisWeek, waitingOnOthers, doneThisWeek]
          properties:
            inboxToTriage: { type: integer }
            dueThisWeek: { type: integer }
            waitingOnOthers: { type: integer }
            doneThisWeek: { type: integer }

    QuickAddInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Raw text with inline syntax !high !low due:fri due:2026-11-20 #backlog @project-slug

    QuickAddResult:
      type: object
      required: [task, warnings]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        warnings:
          type: array
          description: e.g. "No project called @foo, added without a project"
          items:
            type: string

    ClipboardText:
      type: object
      required: [text]
      properties:
        text:
          type: string

    DoNextItem:
      type: object
      required: [task, reason]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        reason:
          type: string
          description: One-line reason, e.g. "Overdue by 2 days" or "High priority, due Friday 13th November"

    SourceCount:
      type: object
      required: [source, count]
      properties:
        source:
          $ref: "#/components/schemas/TaskSource"
        count:
          type: integer

    WaitingItem:
      type: object
      required: [task, daysWaiting]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        daysWaiting:
          type: integer
          description: Whole days since waitingSince (or updatedAt if unknown). Amber at 5 or more.

    CalendarEvent:
      type: object
      required: [id, title, startsAt, endsAt, personal, location, hasBrief]
      properties:
        id:
          type: integer
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        personal:
          type: boolean
        location:
          type: [string, "null"]
        hasBrief:
          type: boolean
          description: A work meeting with someone or something OllieOS knows about. "Brief me" opens /briefs/{id}.
        notPrepped:
          type: boolean
          description: "Part K: an external meeting today whose prep page has not been opened yet"

    HomeSummary:
      type: object
      required: [doNext, inbox, waitingOn, promises, doneThisWeek, lastSweepAt, today, access, knowledgeInbox, digestDate, ideasDue, slackToAnswer, connectorWarnings]
      properties:
        connectorWarnings:
          type: array
          description: "Part Q: services OllieOS reads that need a look"
          items:
            type: object
            required: [key, text]
            properties:
              key: { type: string }
              text: { type: string }
        slackToAnswer: { type: integer, description: "Slack messages that need a reply and have waited over a working day (Part P)" }
        ideasDue:
          type: array
          description: Ideas set to come back to on or before today
          items: { $ref: "#/components/schemas/Idea" }
        digestDate:
          type: [string, "null"]
          description: Today's date (YYYY-MM-DD) once today's digest exists, otherwise null
        knowledgeInbox:
          $ref: "#/components/schemas/KnowledgeInboxCounts"
        doNext:
          type: array
          description: Ranked queue. Overdue first, then High by due date, then Medium by due date. Snoozed tasks are skipped.
          items:
            $ref: "#/components/schemas/DoNextItem"
        inbox:
          type: object
          required: [count, bySource]
          properties:
            count:
              type: integer
            bySource:
              type: array
              items:
                $ref: "#/components/schemas/SourceCount"
        waitingOn:
          type: array
          items:
            $ref: "#/components/schemas/WaitingItem"
        promises:
          type: array
          description: Open tasks with kind promise
          items:
            $ref: "#/components/schemas/Task"
        doneThisWeek:
          type: object
          required: [count, latest]
          properties:
            count:
              type: integer
            latest:
              type: array
              description: Up to 5, most recently completed first
              items:
                $ref: "#/components/schemas/Task"
        lastSweepAt:
          type: [string, "null"]
          format: date-time
          description: When the last successful sweep finished. Null until the sweep runs (milestone 5).
        today:
          type: array
          description: Today's calendar events, in start order. Empty until the sweep writes calendar data (milestone 5).
          items:
            $ref: "#/components/schemas/CalendarEvent"
        access:
          type: object
          required: [pending, open]
          description: AI access requests waiting for Ollie, and approvals still open
          properties:
            pending: { type: array, items: { $ref: "#/components/schemas/AccessRequest" } }
            open: { type: array, items: { $ref: "#/components/schemas/AccessRequest" } }

    BriefSource:
      type: object
      required: [ref, label, href, external]
      properties:
        ref: { type: string }
        label: { type: string }
        href: { type: [string, "null"] }
        external: { type: boolean, description: True for links outside OllieOS (an email, a document) }

    BriefLine:
      type: object
      required: [text, sources]
      properties:
        text: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/BriefSource" } }

    BriefAttendeePerson:
      type: object
      required: [id, slug, name, role, organisation, organisationSlug, confidential, lastContactAt, facts, cadence, decidesOn]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        role: { type: [string, "null"] }
        organisation: { type: [string, "null"] }
        organisationSlug: { type: [string, "null"], description: For the link to the organisation's page }
        confidential: { type: boolean }
        lastContactAt: { type: [string, "null"], format: date-time }
        facts:
          type: array
          description: Up to 4 current facts, most recently confirmed first
          items:
            type: object
            required: [id, text, needsCheck]
            properties:
              id: { type: integer }
              text: { type: string }
              needsCheck: { type: boolean }
        cadence:
          description: Null when the person has no cadence
          oneOf:
            - $ref: "#/components/schemas/BriefCadence"
            - type: "null"
        decidesOn:
          type: array
          description: The projects, products and organisations this person decides on
          items: { $ref: "#/components/schemas/DecidesOnItem" }

    DecidesOnItem:
      type: object
      required: [type, id, name, slug]
      properties:
        type: { type: string, enum: [project, product, organisation] }
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    BriefCadence:
      type: object
      required: [label, status, daysOverdue, daysLeft, daysSince]
      properties:
        label: { type: string, description: e.g. "Every 2 weeks" }
        status: { type: string, description: overdue, due_soon, on_track or paused }
        daysOverdue: { type: [integer, "null"] }
        daysLeft: { type: [integer, "null"] }
        daysSince: { type: [integer, "null"] }

    BriefAttendee:
      type: object
      required: [name, email, response, organiser, person, suggestedOrganisation]
      properties:
        name: { type: string }
        email: { type: [string, "null"] }
        response: { type: [string, "null"], description: accepted, declined, tentative or needs_action }
        organiser: { type: boolean }
        person:
          description: The matching person, or null for no previous contact
          oneOf:
            - $ref: "#/components/schemas/BriefAttendeePerson"
            - type: "null"
        suggestedOrganisation:
          description: Not in Contacts yet, the organisation they probably belong to from their email domain; null for personal addresses
          oneOf:
            - $ref: "#/components/schemas/OrgSuggestion"
            - type: "null"

    OrgSuggestion:
      type: object
      required: [existing, newName, internal]
      properties:
        existing:
          type: [object, "null"]
          description: An organisation already in Contacts
          required: [id, name, slug]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        newName: { type: [string, "null"], description: When none fits, a name for a new one from the domain }
        internal: { type: boolean, description: The domain is Ollie's own company's }

    BriefPromise:
      type: object
      required: [id, title, source, capturedAt, dueDate, personName]
      properties:
        id: { type: integer }
        title: { type: string }
        source: { type: string, description: Where the promise came from, in words }
        capturedAt: { type: string, format: date-time }
        dueDate: { type: [string, "null"], format: date }
        personName: { type: [string, "null"] }

    BriefEvent:
      type: object
      required: [id, title, startsAt, endsAt, location, platform, scope, companies]
      properties:
        id: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, "null"] }
        platform: { type: [string, "null"] }
        scope: { $ref: "#/components/schemas/MeetingScope" }
        companies: { type: array, items: { type: string }, description: "The outside companies on an external meeting: organisation names, else email domains" }

    MeetingScope:
      type: string
      enum: [internal, external]
      description: External when anyone on the meeting is from outside Ollie's own company

    ResearchFact:
      type: object
      required: [label, value, url]
      properties:
        label: { type: string }
        value: { type: string }
        url: { type: [string, "null"] }

    ResearchNews:
      type: object
      required: [date, text, url]
      properties:
        date: { type: [string, "null"] }
        text: { type: string }
        url: { type: [string, "null"] }

    ResearchPerson:
      type: object
      required: [name, role, note, url]
      properties:
        name: { type: string }
        role: { type: [string, "null"] }
        note: { type: [string, "null"] }
        url: { type: [string, "null"] }

    ResearchBody:
      type: object
      required: [name, website, overview, facts, news, people, relationship, openAsks, angles, sources]
      properties:
        name: { type: string }
        website: { type: [string, "null"] }
        overview: { type: string }
        facts: { type: array, items: { $ref: "#/components/schemas/ResearchFact" } }
        news: { type: array, items: { $ref: "#/components/schemas/ResearchNews" } }
        people: { type: array, items: { $ref: "#/components/schemas/ResearchPerson" } }
        relationship: { type: [string, "null"], description: "Where things stand with Ollie, from his email" }
        openAsks: { type: array, items: { type: string } }
        angles: { type: array, items: { type: string } }
        sources:
          type: array
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string }
              url: { type: string }

    CompanyResearch:
      type: object
      required: [domain, status, organisation, body, emailThreads, emailNote, searches, startedAt, researchedAt, stale, error]
      properties:
        domain: { type: string }
        status: { type: string, enum: [none, running, ready, failed] }
        organisation:
          oneOf:
            - type: "null"
            - type: object
              required: [id, slug, name]
              properties:
                id: { type: integer }
                slug: { type: string }
                name: { type: string }
        body:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ResearchBody"
        emailThreads: { type: integer }
        emailNote: { type: [string, "null"] }
        searches: { type: integer }
        startedAt: { type: [string, "null"], format: date-time }
        researchedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: "Older than 30 days" }
        error: { type: [string, "null"] }

    CompanyResearchList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CompanyResearch" } }

    ResearchStart:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain: { type: string, minLength: 3, maxLength: 253, description: "The company's email domain, or an address or website at it" }
        organisationId: { type: integer, description: "Files the research under this organisation" }

    BriefView:
      type: object
      required: [id, event, research, generatedAt, failed, notMuch, sourcesLine, why, questions, questionsNote, agenda, attendees, promises, tasks, waitingOn, earlier, threads, threadsHidden, projects, goals, documents, rules, heldBack, notes, granolaNotes, granolaRef, actions]
      properties:
        id: { type: integer }
        event: { $ref: "#/components/schemas/BriefEvent" }
        research: { type: array, items: { $ref: "#/components/schemas/CompanyResearch" } }
        talkingPoints:
          type: array
          description: "Part K: open Next time I see points for people in the meeting, shown at the top of the agenda"
          items: { $ref: "#/components/schemas/TalkingPoint" }
        followUpTaskId: { type: [integer, "null"], description: "Part K: the follow-up task drafted from this meeting's Granola notes" }
        pulse:
          type: array
          description: "Part S: the pulse of each client organisation in an external meeting"
          items:
            type: object
            required: [name, slug, line, needsAttention, reasons, commercial]
            properties:
              name: { type: string }
              slug: { type: string }
              line: { type: string }
              needsAttention: { type: boolean }
              reasons: { type: array, items: { type: string } }
              commercial: { $ref: "#/components/schemas/Commercial" }
        openedAt: { type: [string, "null"], format: date-time, description: "Part K: when Ollie first opened this prep page" }
        generatedAt: { type: string, format: date-time }
        failed: { type: boolean, description: The model could not write the brief. Refresh to try again. }
        notMuch: { type: boolean, description: Nothing citable on file. Show attendees and promises only. }
        sourcesLine: { type: [string, "null"], description: e.g. "Built from 4 emails, 2 facts and 1 note" }
        why:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BriefLine" }
        questions:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BriefLine" }
        questionsNote: { type: [string, "null"] }
        agenda:
          type: [array, "null"]
          description: Suggested agenda. Null when not much is on file or the brief was written before agendas existed.
          items: { $ref: "#/components/schemas/BriefLine" }
        attendees: { type: array, items: { $ref: "#/components/schemas/BriefAttendee" } }
        promises: { type: array, items: { $ref: "#/components/schemas/BriefPromise" } }
        tasks:
          type: array
          description: Open tasks for people on the meeting, promises aside
          items:
            type: object
            required: [id, title, status, dueDate, personName]
            properties:
              id: { type: integer }
              title: { type: string }
              status: { type: string }
              dueDate: { type: [string, "null"], format: date }
              personName: { type: [string, "null"] }
        waitingOn:
          type: array
          description: What Ollie is waiting on from people on the meeting
          items:
            type: object
            required: [id, title, since, personName]
            properties:
              id: { type: integer }
              title: { type: string }
              since: { type: string, format: date-time }
              personName: { type: [string, "null"] }
        earlier:
          type: array
          description: Granola notes from earlier meetings with any of the same people, newest first
          items:
            type: object
            required: [eventId, title, startsAt, notes, people]
            properties:
              eventId: { type: integer }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              notes: { type: string }
              people: { type: array, items: { type: string } }
        threads:
          type: array
          description: Recent email and Slack exchanges with people on the meeting that are about it
          items:
            type: object
            required: [id, kind, summary, occurredAt, url]
            properties:
              id: { type: integer }
              kind: { type: string, description: email or slack }
              summary: { type: string }
              occurredAt: { type: string, format: date-time }
              url: { type: [string, "null"] }
        threadsHidden:
          type: array
          description: Exchanges with people on the meeting judged not about it, by Ollie or the thread matcher
          items:
            type: object
            required: [id, kind, summary, occurredAt, url, by, reason]
            properties:
              id: { type: integer }
              kind: { type: string }
              summary: { type: string }
              occurredAt: { type: string, format: date-time }
              url: { type: [string, "null"] }
              by: { type: string, enum: [ollie, ai] }
              reason: { type: [string, "null"] }
        projects:
          type: array
          items:
            type: object
            required: [id, slug, name, confidential]
            properties:
              id: { type: integer }
              slug: { type: string }
              name: { type: string }
              confidential: { type: boolean }
        goals:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        documents:
          type: array
          items:
            type: object
            required: [id, title, url, location]
            properties:
              id: { type: integer }
              title: { type: string }
              url: { type: string }
              location: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [id, title, rule]
            properties:
              id: { type: integer }
              title: { type: string }
              rule: { type: string }
        products:
          type: array
          description: Products linked to the meeting's projects and organisations, with the rules linked to each
          items:
            type: object
            required: [id, slug, name, description, state, confidential, ruleIds]
            properties:
              id: { type: integer }
              slug: { type: string }
              name: { type: string }
              description: { type: [string, "null"] }
              state: { $ref: "#/components/schemas/ProductState" }
              confidential: { type: boolean, description: Hidden from AI }
              ruleIds: { type: array, items: { type: integer } }
        playbooks:
          type: array
          description: In use playbooks linked to the meeting's projects and organisations
          items:
            type: object
            required: [id, title, whenToUse, steps]
            properties:
              id: { type: integer }
              title: { type: string }
              whenToUse: { type: string }
              steps: { type: integer, description: How many steps }
        heldBack: { type: integer, description: Attendees, projects or organisations hidden from Ask OllieOS and left out of the brief }
        notes: { type: [string, "null"], description: Ollie's notes for after the meeting }
        granolaNotes: { type: [string, "null"] }
        granolaRef: { type: [string, "null"] }
        actions:
          type: array
          description: Granola actions that went to the Inbox
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { type: integer }
              title: { type: string }
              status: { type: string }

    MeetingRow:
      type: object
      required: [id, title, startsAt, endsAt, day, platform, location, attendees, scope, companies, prep, promises, waiting, granolaSnippet, hasAgenda]
      properties:
        id: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        day: { type: string, format: date, description: London date }
        platform: { type: [string, "null"] }
        location: { type: [string, "null"] }
        attendees:
          type: array
          items:
            type: object
            required: [name, slug]
            properties:
              name: { type: string }
              slug: { type: [string, "null"], description: The person's slug when they are in People }
        scope: { $ref: "#/components/schemas/MeetingScope" }
        companies: { type: array, items: { type: string } }
        prep:
          type: string
          enum: [ready, not_much, failed, not_written, none]
          description: none means nobody or nothing OllieOS knows is on it, so there is no prep page
        promises: { type: integer, description: Open promises to people on the meeting }
        waiting: { type: integer, description: Tasks waiting on people on the meeting }
        granolaSnippet: { type: [string, "null"] }
        hasAgenda: { type: boolean, description: Ollie has written an agenda or notes for it }

    MeetingsList:
      type: object
      required: [today, upcoming, past]
      properties:
        today: { type: string, format: date }
        upcoming: { type: array, items: { $ref: "#/components/schemas/MeetingRow" } }
        past: { type: array, items: { $ref: "#/components/schemas/MeetingRow" } }

    MeetingView:
      type: object
      required: [id, title, startsAt, endsAt, platform, location, scope, companies, prep, attendees, notes, agendaChat, granola, granolaCheck]
      properties:
        id: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        platform: { type: [string, "null"] }
        location: { type: [string, "null"] }
        scope: { $ref: "#/components/schemas/MeetingScope" }
        companies: { type: array, items: { type: string } }
        prep:
          type: string
          enum: [ready, not_much, failed, not_written, none]
          description: Anything but none means the meeting has a prep page at /briefs/{id}
        attendees:
          type: array
          items:
            type: object
            required: [name, email, person, suggestedOrganisation]
            properties:
              name: { type: string }
              email: { type: [string, "null"] }
              person:
                type: [object, "null"]
                description: Set when they are in Contacts
                required: [id, name, slug, organisation]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  slug: { type: string }
                  organisation:
                    type: [object, "null"]
                    required: [name, slug]
                    properties:
                      name: { type: string }
                      slug: { type: string }
              suggestedOrganisation:
                oneOf:
                  - $ref: "#/components/schemas/OrgSuggestion"
                  - type: "null"
        notes: { type: [string, "null"], description: Ollie's agenda and notes }
        agendaChat: { type: array, items: { $ref: "#/components/schemas/AgendaTurn" } }
        granola:
          type: [object, "null"]
          description: The Granola note, once one is linked to the meeting
          required: [url, notes, attachedAt, actions]
          properties:
            url: { type: [string, "null"] }
            notes: { type: string }
            attachedAt: { type: [string, "null"], format: date-time }
            actions:
              type: array
              description: Inbox tasks made from the note's actions
              items:
                type: object
                required: [id, title, status]
                properties:
                  id: { type: integer }
                  title: { type: string }
                  status: { type: string }
        granolaCheck: { type: boolean, description: True when OllieOS reads Granola itself, so a check can fetch the note now }

    MeetingPersonalInput:
      type: object
      required: [personal]
      additionalProperties: false
      properties:
        personal: { type: boolean }

    GranolaLinkInput:
      type: object
      required: [link]
      additionalProperties: false
      properties:
        link: { type: string, minLength: 1, maxLength: 2000, description: A Granola share or note link, or a note id }

    ThreadVerdictInput:
      type: object
      required: [related]
      additionalProperties: false
      properties:
        related: { type: boolean }

    AgendaTurn:
      type: object
      required: [role, text, at]
      properties:
        role: { type: string, enum: [ollie, ai] }
        text: { type: string }
        at: { type: string, format: date-time }

    AgendaInput:
      type: object
      required: [message, agenda]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 4000, description: Ollie's thoughts }
        agenda: { type: string, maxLength: 20000, description: The agenda as it stands in the box, edits included }

    AgendaResult:
      type: object
      required: [agenda, previous, chat]
      properties:
        agenda: { type: string }
        previous: { type: string, description: The agenda before this change, for Undo }
        chat: { type: array, items: { $ref: "#/components/schemas/AgendaTurn" } }

    BriefNotesInput:
      type: object
      required: [notes]
      additionalProperties: false
      properties:
        notes: { type: [string, "null"], maxLength: 20000 }

    DigestItem:
      type: object
      required: [text, href, refs, confidential]
      properties:
        text: { type: string }
        href: { type: [string, "null"] }
        refs: { type: array, items: { type: string } }
