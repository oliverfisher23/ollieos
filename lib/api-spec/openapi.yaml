openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: OllieOS app API. Every route except health and auth requires the signed-in, allowlisted user.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: home
    description: Home screen summary
  - name: tasks
    description: Tasks, quick add and task detail
  - name: knowledge
    description: Projects, people, organisations, decisions, notes, facts, links and search
  - name: ask
    description: Ask OllieOS
  - name: noise
    description: Noise rules
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success, or to /not-authorised when the email is not allowlisted.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /home:
    get:
      operationId: getHome
      tags: [home]
      summary: Everything the Home screen needs in one call
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for a tab with optional filters
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskTab"
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskSource"
        - name: weekStart
          in: query
          required: false
          description: Monday of the week (YYYY-MM-DD, London). Open tabs filter by due date, Done by completion date.
          schema:
            type: string
            format: date
        - name: includeUndated
          in: query
          required: false
          description: With weekStart on open tabs, also include tasks with no due date.
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Tab counts and the four stat cards
      parameters:
        - name: weekStart
          in: query
          required: false
          description: Monday of the week for "Due this week" and "Done this week". Defaults to the current London week.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/quick-add:
    post:
      operationId: quickAddTask
      tags: [tasks]
      summary: Create a task from raw quick-add text (!high !low due:fri #backlog @project-slug)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickAddInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickAddResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Task with source card and history
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update any editable field. Status changes set completedAt, triagedAt and waitingSince.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/snooze:
    post:
      operationId: snoozeTask
      tags: [tasks]
      summary: Snooze until tomorrow 06:00 London time
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Snoozed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/draft-prompt:
    get:
      operationId: getTaskDraftPrompt
      tags: [tasks]
      summary: A prepared prompt for Claude to draft a reply, copied to the clipboard
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Prompt text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipboardText"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/weekly-update:
    get:
      operationId: getWeeklyUpdate
      tags: [tasks]
      summary: Done items for a week grouped by project, as plain text for the clipboard
      parameters:
        - name: weekStart
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly update text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyUpdate"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /tasks/{id}/triage:
    post:
      operationId: triageTask
      tags: [tasks]
      summary: Triage one item to Now, Backlog, Waiting or Noise, optionally making a noise rule
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageInput"
      responses:
        "200":
          description: Triaged task, and the noise rule if one was made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/undo:
    post:
      operationId: undoTask
      tags: [tasks]
      summary: Undo the last status change, triage, snooze or restore on this task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Nothing to undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/restore:
    post:
      operationId: restoreTask
      tags: [tasks]
      summary: Restore a Noise item to the Inbox
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Restored task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Not in Noise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/chase-line:
    get:
      operationId: getTaskChaseLine
      tags: [tasks]
      summary: A short chase message for the person this task is waiting on
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Chase text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipboardText"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/noise-rule-options:
    get:
      operationId: getNoiseRuleOptions
      tags: [tasks]
      summary: Rules that could be made from this item ("Always ignore items like this"). Empty for meeting items.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoiseRuleOption"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /noise-rules:
    get:
      operationId: listNoiseRules
      tags: [noise]
      summary: All noise rules with hit counts
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoiseRule"
        "403":
          $ref: "#/components/responses/NotAuthorised"

  /noise-rules/{id}:
    patch:
      operationId: updateNoiseRule
      tags: [noise]
      summary: Turn a rule on or off
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoiseRuleUpdate"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoiseRule"
        "403":
          $ref: "#/components/responses/NotAuthorised"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /projects:
    get:
      operationId: listProjects
      tags: [knowledge]
      summary: Projects with open task counts, for the Knowledge sidebar and pickers
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProjectListItem" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: createProject
      tags: [knowledge]
      summary: New project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /projects/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getProject
      tags: [knowledge]
      summary: Project page
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [knowledge]
      summary: Edit a project, including its AI access switches
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /people:
    get:
      operationId: listPeople
      tags: [knowledge]
      summary: People with what is open between Ollie and each of them
      responses:
        "200":
          description: People
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PersonListItem" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: createPerson
      tags: [knowledge]
      summary: New person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "409": { $ref: "#/components/responses/Error" }

  /people/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPerson
      tags: [knowledge]
      summary: Person page
      responses:
        "200":
          description: Person detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePerson
      tags: [knowledge]
      summary: Edit a person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /organisations:
    get:
      operationId: listOrganisations
      tags: [knowledge]
      summary: Organisations
      responses:
        "200":
          description: Organisations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrganisationListItem" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: createOrganisation
      tags: [knowledge]
      summary: New organisation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganisationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organisation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /organisations/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getOrganisation
      tags: [knowledge]
      summary: Organisation page
      responses:
        "200":
          description: Organisation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationDetail" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateOrganisation
      tags: [knowledge]
      summary: Edit an organisation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganisationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organisation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /decisions:
    get:
      operationId: listDecisions
      tags: [knowledge]
      summary: All decisions, newest first
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Decision" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: createDecision
      tags: [knowledge]
      summary: Record a decision on a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /decisions/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getDecision
      tags: [knowledge]
      summary: One decision
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateDecision
      tags: [knowledge]
      summary: Edit a decision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /notes:
    get:
      operationId: listNotes
      tags: [knowledge]
      summary: All notes, most recently updated first
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Note" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: createNote
      tags: [knowledge]
      summary: Add a note to a project, person, organisation, task or decision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getNote
      tags: [knowledge]
      summary: One note
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateNote
      tags: [knowledge]
      summary: Edit a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /facts:
    post:
      operationId: createFact
      tags: [knowledge]
      summary: Add a key fact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /facts/{id}/supersede:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: supersedeFact
      tags: [knowledge]
      summary: Replace a fact with new text. The old version is kept and linked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactSupersede" }
      responses:
        "200":
          description: The new current fact, with its history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /links:
    post:
      operationId: createLink
      tags: [knowledge]
      summary: Link two items
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkInput" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeLink
      tags: [knowledge]
      summary: Remove a link between two items
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkInput" }
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /search:
    get:
      operationId: searchKnowledge
      tags: [knowledge]
      summary: Search tasks and Knowledge. Ollie sees everything; hidden-from-AI items are marked.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: types
          in: query
          required: false
          description: Comma-separated list of task, project, person, organisation, decision, note, fact
          schema: { type: string }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /ask:
    get:
      operationId: listAskThreads
      tags: [ask]
      summary: Recent questions
      responses:
        "200":
          description: Recent first questions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AskThreadSummary" } }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: askOllieOS
      tags: [ask]
      summary: Ask a question, or a follow-up when parentId is set. Answers only from items AI may read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskInput" }
      responses:
        "201":
          description: The answer and the conversation it belongs to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /ask/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getAskThread
      tags: [ask]
      summary: A conversation, from its first question to the latest follow-up
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskThread" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }

  /ask/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: draftAskReply
      tags: [ask]
      summary: Draft a reply from an answer. Never sent.
      responses:
        "200":
          description: Conversation with the draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskThread" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /ask/{id}/bundle:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: bundleAskTasks
      tags: [ask]
      summary: Turn the open tasks in an answer into one task
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BundleInput" }
      responses:
        "200":
          description: Conversation with the bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BundleResult" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /ask/{id}/bundle/undo:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: undoAskBundle
      tags: [ask]
      summary: Put the original tasks back and remove the bundled one
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskThread" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token, `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Error:
      description: Invalid input, not found, conflict or upstream failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotAuthorised:
      description: Signed out, or signed in with an email that is not allowlisted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TaskStatus:
      type: string
      enum: [inbox, now, backlog, waiting, done, noise]
    TaskKind:
      type: string
      enum: [task, promise]
    Priority:
      type: string
      enum: [high, medium, low]
    TaskSource:
      type: string
      enum: [email, slack, meeting, quarterly, manual]
    TaskTab:
      type: string
      enum: [inbox, open, now, backlog, waiting, done, noise]

    EntitySummary:
      type: object
      required: [id, name, slug, confidential]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        confidential:
          type: boolean

    Task:
      type: object
      required:
        - id
        - title
        - kind
        - status
        - priority
        - dueDate
        - snoozedUntil
        - source
        - sourceRef
        - sourceUrl
        - sourceQuote
        - sourceSubject
        - fromName
        - fromAddress
        - snippet
        - suggestedAction
        - notes
        - project
        - person
        - waitingOn
        - waitingSince
        - confidential
        - capturedAt
        - createdBy
        - createdAt
        - updatedAt
        - completedAt
        - triagedAt
        - stale
        - noiseRule
      properties:
        id:
          type: integer
        title:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: [string, "null"]
          format: date
        snoozedUntil:
          type: [string, "null"]
          format: date-time
        source:
          $ref: "#/components/schemas/TaskSource"
        sourceRef:
          type: [string, "null"]
        sourceUrl:
          type: [string, "null"]
        sourceQuote:
          type: [string, "null"]
        sourceSubject:
          type: [string, "null"]
        fromName:
          type: [string, "null"]
        fromAddress:
          type: [string, "null"]
        snippet:
          type: [string, "null"]
        suggestedAction:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        project:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        person:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        waitingOn:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        waitingSince:
          type: [string, "null"]
          format: date-time
        confidential:
          type: [boolean, "null"]
          description: null means inherit from linked items
        capturedAt:
          type: [string, "null"]
          format: date-time
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        triagedAt:
          type: [string, "null"]
          format: date-time
        stale:
          type: boolean
          description: Backlog item untouched for 30 days or more
        noiseRule:
          description: The rule that caught this item, if any
          oneOf:
            - $ref: "#/components/schemas/NoiseRuleSummary"
            - type: "null"

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: [string, "null"]
          format: date
        notes:
          type: [string, "null"]
        projectId:
          type: [integer, "null"]
        personId:
          type: [integer, "null"]
        waitingOnPersonId:
          type: [integer, "null"]
        confidential:
          type: [boolean, "null"]

    HistoryEvent:
      type: object
      required: [id, actor, action, summary, createdAt]
      properties:
        id:
          type: integer
        actor:
          type: string
          description: ollie, claude, ingest, or the AI client name
        action:
          type: string
        summary:
          type: string
          description: Plain British English description, e.g. "Status changed from Inbox to Now"
        createdAt:
          type: string
          format: date-time

    TaskDetail:
      type: object
      required: [task, history]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        history:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/HistoryEvent"

    TaskSummary:
      type: object
      required: [tabs, stats]
      properties:
        tabs:
          type: object
          required: [inbox, open, now, backlog, waiting, done, noise]
          properties:
            inbox: { type: integer }
            open: { type: integer, description: "inbox + now + backlog + waiting" }
            now: { type: integer }
            backlog: { type: integer }
            waiting: { type: integer }
            done: { type: integer }
            noise: { type: integer }
        stats:
          type: object
          required: [inboxToTriage, dueThisWeek, waitingOnOthers, doneThisWeek]
          properties:
            inboxToTriage: { type: integer }
            dueThisWeek: { type: integer }
            waitingOnOthers: { type: integer }
            doneThisWeek: { type: integer }

    QuickAddInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Raw text with inline syntax !high !low due:fri due:2026-11-20 #backlog @project-slug

    QuickAddResult:
      type: object
      required: [task, warnings]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        warnings:
          type: array
          description: e.g. "No project called @foo, added without a project"
          items:
            type: string

    ClipboardText:
      type: object
      required: [text]
      properties:
        text:
          type: string

    DoNextItem:
      type: object
      required: [task, reason]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        reason:
          type: string
          description: One-line reason, e.g. "Overdue by 2 days" or "High priority, due Friday 13th November"

    SourceCount:
      type: object
      required: [source, count]
      properties:
        source:
          $ref: "#/components/schemas/TaskSource"
        count:
          type: integer

    WaitingItem:
      type: object
      required: [task, daysWaiting]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        daysWaiting:
          type: integer
          description: Whole days since waitingSince (or updatedAt if unknown). Amber at 5 or more.

    CalendarEvent:
      type: object
      required: [id, title, startsAt, endsAt, personal, location]
      properties:
        id:
          type: integer
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        personal:
          type: boolean
        location:
          type: [string, "null"]

    HomeSummary:
      type: object
      required: [doNext, inbox, waitingOn, promises, doneThisWeek, lastSweepAt, today]
      properties:
        doNext:
          type: array
          description: Ranked queue. Overdue first, then High by due date, then Medium by due date. Snoozed tasks are skipped.
          items:
            $ref: "#/components/schemas/DoNextItem"
        inbox:
          type: object
          required: [count, bySource]
          properties:
            count:
              type: integer
            bySource:
              type: array
              items:
                $ref: "#/components/schemas/SourceCount"
        waitingOn:
          type: array
          items:
            $ref: "#/components/schemas/WaitingItem"
        promises:
          type: array
          description: Open tasks with kind promise
          items:
            $ref: "#/components/schemas/Task"
        doneThisWeek:
          type: object
          required: [count, latest]
          properties:
            count:
              type: integer
            latest:
              type: array
              description: Up to 5, most recently completed first
              items:
                $ref: "#/components/schemas/Task"
        lastSweepAt:
          type: [string, "null"]
          format: date-time
          description: When the last successful sweep finished. Null until the sweep runs (milestone 5).
        today:
          type: array
          description: Today's calendar events, in start order. Empty until the sweep writes calendar data (milestone 5).
          items:
            $ref: "#/components/schemas/CalendarEvent"

    NoiseMatchType:
      type: string
      enum: [from_address_equals, from_domain_equals, slack_channel_equals, title_contains]

    NoiseRuleSummary:
      type: object
      required: [id, matchType, matchValue, label]
      properties:
        id:
          type: integer
        matchType:
          $ref: "#/components/schemas/NoiseMatchType"
        matchValue:
          type: string
        label:
          type: string
          description: Plain description, e.g. "Emails from news@example.com"

    NoiseRule:
      type: object
      required: [id, matchType, matchValue, label, source, enabled, hitCount, lastHitAt, createdFromTaskId, createdAt]
      properties:
        id:
          type: integer
        matchType:
          $ref: "#/components/schemas/NoiseMatchType"
        matchValue:
          type: string
        label:
          type: string
        source:
          oneOf:
            - $ref: "#/components/schemas/TaskSource"
            - type: "null"
        enabled:
          type: boolean
        hitCount:
          type: integer
        lastHitAt:
          type: [string, "null"]
          format: date-time
        createdFromTaskId:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time

    NoiseRuleUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    NoiseRuleOption:
      type: object
      required: [matchType, matchValue, label]
      properties:
        matchType:
          $ref: "#/components/schemas/NoiseMatchType"
        matchValue:
          type: string
        label:
          type: string

    TriageInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [now, backlog, waiting, noise]
        waitingOnPersonId:
          type: [integer, "null"]
          description: For waiting. If left out, keeps the current Waiting on, or uses the For person.
        noiseRule:
          description: For noise. Makes (or re-enables) a rule so new items like this skip the Inbox.
          type: object
          required: [matchType, matchValue]
          properties:
            matchType:
              $ref: "#/components/schemas/NoiseMatchType"
            matchValue:
              type: string
              minLength: 1

    TriageResult:
      type: object
      required: [task, noiseRule]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        noiseRule:
          oneOf:
            - $ref: "#/components/schemas/NoiseRule"
            - type: "null"

    WeeklyUpdate:
      type: object
      required: [text, count, weekStart]
      properties:
        text:
          type: string
        count:
          type: integer
        weekStart:
          type: string
          format: date

    ProjectListItem:
      type: object
      required: [id, name, slug, confidential, aiAccess, area, status, openTaskCount, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        confidential: { type: boolean }
        aiAccess: { type: boolean }
        area: { type: [string, "null"] }
        status: { type: [string, "null"] }
        openTaskCount: { type: integer }
        updatedAt: { type: string, format: date-time }

    Project:
      type: object
      required: [id, name, slug, area, status, summary, confidential, aiAccess, archived, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        area: { type: [string, "null"] }
        status: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        confidential: { type: boolean }
        aiAccess: { type: boolean, description: Readable by AI. Has no effect while confidential is on. }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        area: { type: [string, "null"] }
        status: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        confidential: { type: boolean }
        aiAccess: { type: boolean }

    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        area: { type: [string, "null"] }
        status: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        confidential: { type: boolean }
        aiAccess: { type: boolean }
        archived: { type: boolean }

    LinkedEntity:
      type: object
      required: [id, name, slug, confidential, linked]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        confidential: { type: boolean }
        linked: { type: boolean, description: True when joined by a link Ollie can remove, false when it only comes from tasks or membership }

    PersonChip:
      type: object
      required: [id, name, slug, confidential, role, organisationName, linked]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        confidential: { type: boolean }
        role: { type: [string, "null"] }
        organisationName: { type: [string, "null"] }
        linked: { type: boolean }

    FactVersion:
      type: object
      required: [id, text, createdAt, createdBy]
      properties:
        id: { type: integer }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }

    Fact:
      type: object
      required: [id, entityType, entityId, text, source, createdBy, createdAt, history]
      properties:
        id: { type: integer }
        entityType: { type: string }
        entityId: { type: integer }
        text: { type: string }
        source: { type: [string, "null"] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        history:
          type: array
          description: Earlier versions this fact replaced, newest first
          items: { $ref: "#/components/schemas/FactVersion" }

    FactInput:
      type: object
      required: [entityType, entityId, text]
      properties:
        entityType: { type: string, enum: [project, person, organisation] }
        entityId: { type: integer }
        text: { type: string, minLength: 1, maxLength: 2000 }
        source: { type: [string, "null"] }

    FactSupersede:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        source: { type: [string, "null"] }

    Decision:
      type: object
      required: [id, text, decidedAt, decidedBy, source, confidential, hiddenFromAi, project, createdBy, createdAt]
      properties:
        id: { type: integer }
        text: { type: string }
        decidedAt: { type: string, format: date }
        decidedBy: { type: [string, "null"] }
        source: { type: [string, "null"] }
        confidential: { type: [boolean, "null"], description: null means it follows its project }
        hiddenFromAi: { type: boolean }
        project: { $ref: "#/components/schemas/EntitySummary" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    DecisionInput:
      type: object
      required: [projectId, text, decidedAt]
      properties:
        projectId: { type: integer }
        text: { type: string, minLength: 1, maxLength: 5000 }
        decidedAt: { type: string, format: date }
        decidedBy: { type: [string, "null"] }
        source: { type: [string, "null"] }
        confidential: { type: [boolean, "null"] }

    DecisionUpdate:
      type: object
      properties:
        projectId: { type: integer }
        text: { type: string, minLength: 1, maxLength: 5000 }
        decidedAt: { type: string, format: date }
        decidedBy: { type: [string, "null"] }
        source: { type: [string, "null"] }
        confidential: { type: [boolean, "null"] }

    EntityRef:
      type: object
      required: [type, id, name, slug]
      properties:
