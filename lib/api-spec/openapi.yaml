        gmailUrl: { type: [string, "null"] }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/EmailThreadMessage"
    ReplyBriefInput:
      type: object
      additionalProperties: false
      required: [brief]
      properties:
        brief: { type: string, minLength: 1, maxLength: 500, description: What the reply should say, in a line }
    EmailAttachmentInput:
      type: object
      additionalProperties: false
      required: [messageId, partId]
      properties:
        messageId: { type: string, minLength: 1, maxLength: 200 }
        partId: { type: string, maxLength: 50 }
    EmailAttachment:
      type: object
      required: [partId, filename, size, canSave, documentId]
      properties:
        partId: { type: string }
        filename: { type: string }
        size: { type: integer, description: Bytes }
        canSave: { type: boolean, description: "A PDF, Word or text file under 10 MB" }
        documentId: { type: [integer, "null"], description: The Library document it was saved as }
