    post:
      operationId: startResearch
      tags: [preparation]
      summary: Research an outside company now (web search and Ollie's email with them)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchStart" }
      responses:
        "200":
          description: The research, now running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyResearch" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /oauth/consent:
    get:
      operationId: getOAuthConsent
      tags: [access]
      summary: What a tool asking to connect wants, for the consent screen
      parameters:
        - name: req
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consent details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthConsent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }
    post:
      operationId: decideOAuthConsent
      tags: [access]
      summary: Approve or deny a connection. Returns where to send the browser next.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthConsentDecision" }
      responses:
        "200":
          description: Redirect target
          content:
            application/json:
              schema:
                type: object
                required: [redirectTo]
                properties:
                  redirectTo: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /ai-access/summary:
    get:
      operationId: getAiAccessSummary
      tags: [access]
      summary: Counts for the AI access settings page
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAccessSummary" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

  /ai-activity:
    get:
      operationId: listAiActivity
      tags: [access]
      summary: The last AI actions, newest first, with reads from one call grouped
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiActivity" }
        "403": { $ref: "#/components/responses/NotAuthorised" }

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token, `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Error:
      description: Invalid input, not found, conflict or upstream failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotAuthorised:
      description: Signed out, or signed in with an email that is not allowlisted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TaskStatus:
      type: string
      enum: [inbox, now, backlog, waiting, done, noise, dropped]
    TaskKind:
      type: string
      enum: [task, promise]
    Priority:
      type: string
      enum: [high, medium, low]
    TaskSource:
      type: string
      enum: [email, slack, meeting, quarterly, manual, session]
    TaskTab:
      type: string
      enum: [inbox, open, now, backlog, waiting, done, noise, dropped]

    EntitySummary:
      type: object
      required: [id, name, slug, confidential]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        confidential:
          type: boolean

    Task:
      type: object
      required:
        - id
        - title
        - kind
        - status
        - priority
        - dueDate
        - snoozedUntil
        - source
        - sourceRef
        - sourceUrl
        - sourceQuote
        - sourceSubject
        - fromName
        - fromAddress
        - snippet
        - suggestedAction
        - notes
        - project
        - person
        - waitingOn
        - waitingSince
        - confidential
        - capturedAt
        - createdBy
        - createdAt
        - updatedAt
        - completedAt
        - triagedAt
        - stale
        - noiseRule
        - hiddenFromAi
        - goal
        - goalId
        - notGoalWork
        - noiseHint
      properties:
        id:
          type: integer
        title:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: [string, "null"]
          format: date
        snoozedUntil:
          type: [string, "null"]
          format: date-time
        source:
          $ref: "#/components/schemas/TaskSource"
        sourceRef:
          type: [string, "null"]
        sourceUrl:
          type: [string, "null"]
        sourceQuote:
          type: [string, "null"]
        sourceSubject:
          type: [string, "null"]
        fromName:
          type: [string, "null"]
        fromAddress:
          type: [string, "null"]
        snippet:
          type: [string, "null"]
        suggestedAction:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        project:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        person:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        waitingOn:
          oneOf:
            - $ref: "#/components/schemas/EntitySummary"
            - type: "null"
        waitingSince:
          type: [string, "null"]
          format: date-time
        confidential:
          type: [boolean, "null"]
          description: null means inherit from linked items
        capturedAt:
          type: [string, "null"]
          format: date-time
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        triagedAt:
          type: [string, "null"]
          format: date-time
        stale:
          type: boolean
          description: Backlog item untouched for 30 days or more
        noiseRule:
          description: The rule that caught this item, if any
          oneOf:
            - $ref: "#/components/schemas/NoiseRuleSummary"
            - type: "null"
        hiddenFromAi:
          type: boolean
          description: AI tools cannot read this task without an approval (own flag or inherited)
        goal:
          description: The goal it counts towards, its own link or else its project's (inherited)
          oneOf:
            - $ref: "#/components/schemas/TaskGoal"
            - type: "null"
        goalId:
          type: [integer, "null"]
          description: A direct goal link; overrides the project's goal
        notGoalWork:
          type: boolean
          description: Ollie marked it as not goal work
        noiseHint:
          type: [string, "null"]
          description: Why this Inbox item is probably noise. Null when it looks real, once kept, or outside the Inbox.

    TaskGoal:
      type: object
      required: [id, name, inherited]
      properties:
        id: { type: integer }
        name: { type: string }
        inherited: { type: boolean, description: True when it comes from the task's project }

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: [string, "null"]
          format: date
        notes:
          type: [string, "null"]
        projectId:
          type: [integer, "null"]
        personId:
          type: [integer, "null"]
        waitingOnPersonId:
          type: [integer, "null"]
        confidential:
          type: [boolean, "null"]
        goalId:
          type: [integer, "null"]
        notGoalWork:
          type: boolean

    HistoryEvent:
      type: object
      required: [id, actor, action, summary, createdAt]
      properties:
        id:
          type: integer
        actor:
          type: string
          description: ollie, claude, ingest, or the AI client name
        action:
          type: string
        summary:
          type: string
          description: Plain British English description, e.g. "Status changed from Inbox to Now"
        createdAt:
          type: string
          format: date-time

    TaskDetail:
      type: object
      required: [task, history]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        history:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/HistoryEvent"

    TaskSummary:
      type: object
      required: [tabs, stats]
      properties:
        tabs:
          type: object
          required: [inbox, open, now, backlog, waiting, done, noise, dropped]
          properties:
            inbox: { type: integer }
            open: { type: integer, description: "inbox + now + backlog + waiting" }
            now: { type: integer }
            backlog: { type: integer }
            waiting: { type: integer }
            done: { type: integer }
            noise: { type: integer }
            dropped: { type: integer }
        stats:
          type: object
          required: [inboxToTriage, dueThisWeek, waitingOnOthers, doneThisWeek]
          properties:
            inboxToTriage: { type: integer }
            dueThisWeek: { type: integer }
            waitingOnOthers: { type: integer }
            doneThisWeek: { type: integer }

    QuickAddInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Raw text with inline syntax !high !low due:fri due:2026-11-20 #backlog @project-slug

    QuickAddResult:
      type: object
      required: [task, warnings]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        warnings:
          type: array
          description: e.g. "No project called @foo, added without a project"
          items:
            type: string

    ClipboardText:
      type: object
      required: [text]
      properties:
        text:
          type: string

    DoNextItem:
      type: object
      required: [task, reason]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        reason:
          type: string
          description: One-line reason, e.g. "Overdue by 2 days" or "High priority, due Friday 13th November"

    SourceCount:
      type: object
      required: [source, count]
      properties:
        source:
          $ref: "#/components/schemas/TaskSource"
        count:
          type: integer

    WaitingItem:
      type: object
      required: [task, daysWaiting]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        daysWaiting:
          type: integer
          description: Whole days since waitingSince (or updatedAt if unknown). Amber at 5 or more.

    CalendarEvent:
      type: object
      required: [id, title, startsAt, endsAt, personal, location, hasBrief]
      properties:
        id:
          type: integer
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        personal:
          type: boolean
        location:
          type: [string, "null"]
        hasBrief:
          type: boolean
          description: A work meeting with someone or something OllieOS knows about. "Brief me" opens /briefs/{id}.

    HomeSummary:
      type: object
      required: [doNext, inbox, waitingOn, promises, doneThisWeek, lastSweepAt, today, access, knowledgeInbox, digestDate]
      properties:
        digestDate:
          type: [string, "null"]
          description: Today's date (YYYY-MM-DD) once today's digest exists, otherwise null
        knowledgeInbox:
          $ref: "#/components/schemas/KnowledgeInboxCounts"
        doNext:
          type: array
          description: Ranked queue. Overdue first, then High by due date, then Medium by due date. Snoozed tasks are skipped.
          items:
            $ref: "#/components/schemas/DoNextItem"
        inbox:
          type: object
          required: [count, bySource]
          properties:
            count:
              type: integer
            bySource:
              type: array
              items:
                $ref: "#/components/schemas/SourceCount"
        waitingOn:
          type: array
          items:
            $ref: "#/components/schemas/WaitingItem"
        promises:
          type: array
          description: Open tasks with kind promise
          items:
            $ref: "#/components/schemas/Task"
        doneThisWeek:
          type: object
          required: [count, latest]
          properties:
            count:
              type: integer
            latest:
              type: array
              description: Up to 5, most recently completed first
              items:
                $ref: "#/components/schemas/Task"
        lastSweepAt:
          type: [string, "null"]
          format: date-time
          description: When the last successful sweep finished. Null until the sweep runs (milestone 5).
        today:
          type: array
          description: Today's calendar events, in start order. Empty until the sweep writes calendar data (milestone 5).
          items:
            $ref: "#/components/schemas/CalendarEvent"
        access:
          type: object
          required: [pending, open]
          description: AI access requests waiting for Ollie, and approvals still open
          properties:
            pending: { type: array, items: { $ref: "#/components/schemas/AccessRequest" } }
            open: { type: array, items: { $ref: "#/components/schemas/AccessRequest" } }

    BriefSource:
      type: object
      required: [ref, label, href, external]
      properties:
        ref: { type: string }
        label: { type: string }
        href: { type: [string, "null"] }
        external: { type: boolean, description: True for links outside OllieOS (an email, a document) }

    BriefLine:
      type: object
      required: [text, sources]
      properties:
        text: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/BriefSource" } }

    BriefAttendeePerson:
      type: object
      required: [id, slug, name, role, organisation, confidential, lastContactAt, facts, cadence]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        role: { type: [string, "null"] }
        organisation: { type: [string, "null"] }
        confidential: { type: boolean }
        lastContactAt: { type: [string, "null"], format: date-time }
        facts:
          type: array
          description: Up to 4 current facts, most recently confirmed first
          items:
            type: object
            required: [id, text, needsCheck]
            properties:
              id: { type: integer }
              text: { type: string }
              needsCheck: { type: boolean }
        cadence:
          description: Null when the person has no cadence
          oneOf:
            - $ref: "#/components/schemas/BriefCadence"
            - type: "null"

    BriefCadence:
      type: object
      required: [label, status, daysOverdue, daysLeft, daysSince]
      properties:
        label: { type: string, description: e.g. "Every 2 weeks" }
        status: { type: string, description: overdue, due_soon, on_track or paused }
        daysOverdue: { type: [integer, "null"] }
        daysLeft: { type: [integer, "null"] }
        daysSince: { type: [integer, "null"] }

    BriefAttendee:
      type: object
      required: [name, email, response, organiser, person]
      properties:
        name: { type: string }
        email: { type: [string, "null"] }
        response: { type: [string, "null"], description: accepted, declined, tentative or needs_action }
        organiser: { type: boolean }
        person:
          description: The matching person, or null for no previous contact
          oneOf:
            - $ref: "#/components/schemas/BriefAttendeePerson"
            - type: "null"

    BriefPromise:
      type: object
      required: [id, title, source, capturedAt, dueDate, personName]
      properties:
        id: { type: integer }
        title: { type: string }
        source: { type: string, description: Where the promise came from, in words }
        capturedAt: { type: string, format: date-time }
        dueDate: { type: [string, "null"], format: date }
        personName: { type: [string, "null"] }

    BriefEvent:
      type: object
      required: [id, title, startsAt, endsAt, location, platform, scope, companies]
      properties:
        id: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, "null"] }
        platform: { type: [string, "null"] }
        scope: { $ref: "#/components/schemas/MeetingScope" }
        companies: { type: array, items: { type: string }, description: "The outside companies on an external meeting: organisation names, else email domains" }

    MeetingScope:
      type: string
      enum: [internal, external]
      description: External when anyone on the meeting is from outside Ollie's own company

    ResearchFact:
      type: object
      required: [label, value, url]
      properties:
        label: { type: string }
        value: { type: string }
        url: { type: [string, "null"] }

    ResearchNews:
      type: object
      required: [date, text, url]
      properties:
        date: { type: [string, "null"] }
        text: { type: string }
        url: { type: [string, "null"] }

    ResearchPerson:
      type: object
      required: [name, role, note, url]
      properties:
        name: { type: string }
        role: { type: [string, "null"] }
        note: { type: [string, "null"] }
        url: { type: [string, "null"] }

    ResearchBody:
      type: object
      required: [name, website, overview, facts, news, people, relationship, openAsks, angles, sources]
      properties:
        name: { type: string }
        website: { type: [string, "null"] }
        overview: { type: string }
        facts: { type: array, items: { $ref: "#/components/schemas/ResearchFact" } }
        news: { type: array, items: { $ref: "#/components/schemas/ResearchNews" } }
        people: { type: array, items: { $ref: "#/components/schemas/ResearchPerson" } }
        relationship: { type: [string, "null"], description: "Where things stand with Ollie, from his email" }
        openAsks: { type: array, items: { type: string } }
        angles: { type: array, items: { type: string } }
        sources:
          type: array
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string }
              url: { type: string }

    CompanyResearch:
      type: object
      required: [domain, status, organisation, body, emailThreads, emailNote, searches, startedAt, researchedAt, stale, error]
      properties:
        domain: { type: string }
        status: { type: string, enum: [none, running, ready, failed] }
        organisation:
          oneOf:
            - type: "null"
            - type: object
              required: [id, slug, name]
              properties:
                id: { type: integer }
                slug: { type: string }
                name: { type: string }
        body:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ResearchBody"
        emailThreads: { type: integer }
        emailNote: { type: [string, "null"] }
        searches: { type: integer }
        startedAt: { type: [string, "null"], format: date-time }
        researchedAt: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: "Older than 30 days" }
        error: { type: [string, "null"] }

    CompanyResearchList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CompanyResearch" } }

    ResearchStart:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain: { type: string, minLength: 3, maxLength: 253, description: "The company's email domain, or an address or website at it" }
        organisationId: { type: integer, description: "Files the research under this organisation" }

    BriefView:
      type: object
      required: [event, research, generatedAt, failed, notMuch, sourcesLine, why, questions, questionsNote, agenda, attendees, promises, tasks, waitingOn, earlier, threads, projects, goals, documents, playbooks, heldBack, notes, granolaNotes, granolaRef, actions]
      properties:
        event: { $ref: "#/components/schemas/BriefEvent" }
        research: { type: array, items: { $ref: "#/components/schemas/CompanyResearch" } }
        generatedAt: { type: string, format: date-time }
        failed: { type: boolean, description: The model could not write the brief. Refresh to try again. }
        notMuch: { type: boolean, description: Nothing citable on file. Show attendees and promises only. }
        sourcesLine: { type: [string, "null"], description: e.g. "Built from 4 emails, 2 facts and 1 note" }
        why:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BriefLine" }
        questions:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BriefLine" }
        questionsNote: { type: [string, "null"] }
        agenda:
          type: [array, "null"]
          description: Suggested agenda. Null when not much is on file or the brief was written before agendas existed.
          items: { $ref: "#/components/schemas/BriefLine" }
        attendees: { type: array, items: { $ref: "#/components/schemas/BriefAttendee" } }
        promises: { type: array, items: { $ref: "#/components/schemas/BriefPromise" } }
        tasks:
          type: array
          description: Open tasks for people on the meeting, promises aside
          items:
            type: object
            required: [id, title, status, dueDate, personName]
            properties:
              id: { type: integer }
              title: { type: string }
              status: { type: string }
              dueDate: { type: [string, "null"], format: date }
              personName: { type: [string, "null"] }
        waitingOn:
          type: array
          description: What Ollie is waiting on from people on the meeting
          items:
            type: object
            required: [id, title, since, personName]
            properties:
              id: { type: integer }
              title: { type: string }
              since: { type: string, format: date-time }
              personName: { type: [string, "null"] }
        earlier:
          type: array
          description: Granola notes from earlier meetings with any of the same people, newest first
          items:
            type: object
            required: [eventId, title, startsAt, notes, people]
            properties:
              eventId: { type: integer }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              notes: { type: string }
              people: { type: array, items: { type: string } }
        threads:
          type: array
          description: Recent email and Slack exchanges with people on the meeting
          items:
            type: object
            required: [id, kind, summary, occurredAt, url]
            properties:
              id: { type: integer }
              kind: { type: string, description: email or slack }
              summary: { type: string }
              occurredAt: { type: string, format: date-time }
              url: { type: [string, "null"] }
        projects:
          type: array
          items:
            type: object
            required: [id, slug, name, confidential]
            properties:
              id: { type: integer }
              slug: { type: string }
              name: { type: string }
              confidential: { type: boolean }
        goals:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        documents:
          type: array
