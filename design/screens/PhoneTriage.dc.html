<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>OllieOS Phone Triage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0;background:#16171b}
a{color:#ffffff}a:hover{color:#e9e4da}
button:focus-visible,a:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Google Sans', 'DM Sans', system-ui, sans-serif; color: #ffffff; background: radial-gradient(140% 60% at 90% 110%, rgba(181,68,26,0.55) 0%, rgba(181,68,26,0) 55%), #16171b; display: flex; flex-direction: column; padding: 56px 16px 28px; gap: 16px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <a href="PhoneHome.dc.html" style="font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>Home</a>
    <span style="font-size: 14px; color: rgba(255,255,255,0.82); font-variant-numeric: tabular-nums;">{{pos}}</span>
  </div>
  <div aria-hidden="true" style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden;"><div style="height: 100%; background: #f4c542; {{bar}}"></div></div>

  <sc-if value="{{hasItem}}" hint-placeholder-val="{{ true }}">
    <section aria-label="Inbox item" style="flex: 1 1 auto; min-height: 0; padding: 20px; border-radius: 24px; background: #ffffff; color: #1b1d22; display: flex; flex-direction: column; gap: 12px;">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #55524c;"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; {{cur.badge}}">{{cur.mark}}</span>{{cur.source}} · {{cur.from}}</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3;">{{cur.title}}</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3d3a35;">{{cur.snippet}}</p>
      <div style="margin-top: auto; padding: 12px 14px; border-radius: 14px; background: #f1efea; font-size: 13px; color: #3d3a35;">Suggested: <b style="font-weight: 600; color: #1b1d22;">{{cur.suggest}}</b></div>
    </section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button type="button" onClick="{{act}}" style="font: inherit; font-size: 16px; font-weight: 600; min-height: 56px; border-radius: 16px; border: 0; background: #ffffff; color: #1b1d22; cursor: pointer;">Now</button>
      <button type="button" onClick="{{act}}" style="font: inherit; font-size: 16px; min-height: 56px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #ffffff; cursor: pointer;">Backlog</button>
      <button type="button" onClick="{{act}}" style="font: inherit; font-size: 16px; min-height: 56px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #ffffff; cursor: pointer;">Waiting</button>
      <button type="button" onClick="{{act}}" style="font: inherit; font-size: 16px; min-height: 56px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); cursor: pointer;">Noise</button>
    </div>
    <button type="button" onClick="{{undo}}" style="font: inherit; font-size: 14px; min-height: 44px; border: 0; background: transparent; color: #f4c542; cursor: pointer;">{{undoLabel}}</button>
  </sc-if>
  <sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;">
      <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 34px;">Inbox clear.</p>
      <a href="PhoneHome.dc.html" style="font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 999px; background: #ffffff; color: #1b1d22; text-decoration: none;">Back to Home</a>
      <button type="button" onClick="{{reset}}" style="font: inherit; font-size: 14px; min-height: 44px; border: 0; background: transparent; color: rgba(255,255,255,0.8); cursor: pointer;">Replay example</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const items = [
      { title: 'Reply to Gp Capt Martin Adcock on RAFAC participation', source: 'Email', from: 'Martin Adcock', mark: 'E', badge: 'background: #d9e2f1; color: #233455;', snippet: 'Had not seen the original email; will look, discuss and get back to Tony.', suggest: 'Waiting on, Medium' },
      { title: 'Share US employer pulse survey draft with Sam and Andy', source: 'Meeting', from: 'Weekly Leadership Call', mark: 'M', badge: 'background: #f3dccf; color: #6b2d12;', snippet: 'Example item: an action given to you in a meeting.', suggest: 'Now, High, due Friday' },
      { title: 'Send ADS demo link before Tuesday call', source: 'Slack', from: 'Kat Gibbs', mark: 'S', badge: 'background: #efe7fb; color: #5b2e9c;', snippet: 'Example item: a Slack ask.', suggest: 'Now, Medium, due Tuesday' },
      { title: 'Enable Prezzee API for student voucher payouts', source: 'Email', from: 'Ahlam Bennajem', mark: 'E', badge: 'background: #d9e2f1; color: #233455;', snippet: 'Steps to add you to the existing Springpod Prezzee Business account.', suggest: 'Backlog, Medium' },
      { title: 'Traffic partnership with WhatJobs', source: 'Email', from: 'Isla Anderson', mark: 'E', badge: 'background: #d9e2f1; color: #233455;', snippet: 'Second follow-up about an audience referral partnership.', suggest: 'Noise, and ignore whatjobs.com' },
      { title: 'AppCheck: 85 new discovered assets', source: 'Email', from: 'AppCheck', mark: 'E', badge: 'background: #d9e2f1; color: #233455;', snippet: 'Review and add to scope or suppress.', suggest: 'Noise' }
    ];
    const i = this.state.i;
    const n = items.length;
    return {
      cur: items[Math.min(i, n - 1)],
      hasItem: i < n,
      allDone: i >= n,
      pos: i < n ? (i + 1) + ' of ' + n : n + ' of ' + n,
      bar: 'width: ' + Math.round((i / n) * 100) + '%;',
      act: () => this.setState({ i: i + 1 }),
      undo: () => this.setState({ i: Math.max(0, i - 1) }),
      undoLabel: i > 0 ? 'Undo last' : 'Swipe right for Now, left for Noise',
      reset: () => this.setState({ i: 0 })
    };
  }
}
</script>
</body>
</html>
